notes: 'NOT verified, and the fit is the problem: Feetech''s STS3215 is 25T / OD 5.9 mm but DFRobot''s FIT0037 lists its spline as 5.3 mm. A 25T horn that is not cut for the 5.9 mm OD may be loose or may
  not seat; no seller states STS3215 compatibility, and a Core Electronics note says a Power HD horn for the HD-1235MG does not fit Feetech FT5335M, so brand-specific spline variation exists. Cheapest safe option:
  each STS3215 ships with horns in the box (Seeed C047: 2 horns + 18 screws, per the catalog sts3215-12v datasheet note) (plastic POM). Buy ONE
  aluminium disc and try it on the bench STS3215 before ordering 23. dimensions_mm: thickness 5 mm is a guess; the CAD horn model has the real numbers. Prices converted at about 0.66 USD/AUD, 0.012 USD/INR.'
