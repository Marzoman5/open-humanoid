notes: 'USE THE UL FIGURE, 20 A, for the R1 star point: 32 A is the EN 60664 rating with a 4 mm2 conductor. Each connector is ONE bus bar, so it carries 20 A in total across its five openings.
  The R1 trunk (20 A ATO fuse) therefore sits exactly AT one connector''s UL rating, with no margin (the fuse opens in 0.15-5 s at 2x, a sustained 20 A will warm the connector). COUNT: the R1 star has 1 trunk +
  7 segment feeds = 8 wires per polarity, which needs two 221-415 per polarity joined by a jumper (5 + 5 - 2 = 8 openings), i.e. 4 connectors, not 2 (a 6-conductor 221-615 holds 6, still not 8). One 10-pack
  covers it. Mass is an upper bound: a pack of 10 ships at 0.096 lb (43.5 g) including packaging. dimensions_mm = 30 x 8.4 x 18.6 exactly as Core Electronics lists them (stated "W x H x D"; one
  retailer, axis assignment and lever-open height unconfirmed, measure one). Distributor pages disagree (450 V vs 600 V, 24-12 vs 24-10 AWG); the 600 V / 24-12 AWG pair matches the UL cut sheet. The 222 series is a different, older part.'
