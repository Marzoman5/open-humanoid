notes: 'NOT verified: silicone hook-up wire has no manufacturer datasheet; the OD, strand count and 200 C / 600 V figures are seller claims, and only one vendor was in stock. mass_kg is PER METRE and
  COMPUTED (1.3 mm2 copper 11.6 g/m + ~7 g/m silicone at 3 mm OD), not weighed. Ampacity: Powerstream "chassis wiring" 22 A is for wire in free air, not in a bundle, and is conservative; it is a
  generic table value, so the R1 "16 AWG trunk 22 A" claim rests on that table, not on this wire. Engineering ToolBox lists 15 A for single-core 16 AWG (PVC, 30 C), the stricter number to use inside a
  harness. A 20 A ATO fuse on this wire inside a bundle is therefore NOT covered by a standard table; verify temperature rise on the bench. Resistance 0.0132 ohm/m (Powerstream).'
