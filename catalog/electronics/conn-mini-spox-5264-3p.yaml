notes: 'NOT verified as a PART, but the rating is cited: Molex lists 3.0 A MAXIMUM PER CONTACT and 250 V for the Mini-SPOX 5264/5267 system (22 AWG wire). Caveats: (1) Molex pitch is 2.50 mm but Waveshare
  calls the servo connector "2.54", so the STS3215 lead is probably a generic 5264-style clone, not a Molex part; clone contact plating and the crimp are the real limits and no rating exists for the
  servo''s own leads (their wire gauge is not published). Do not assume 3 A. (2) The 3 A is per contact at 22 AWG; the STS3250 stalls at 4.2 A, over it (R1 section 7.2). (3) The ratings page is the
  header (5267); the housing 5264 is its mate and the system is rated as one. Mass 0.5 g is an estimate. 2.5 mm Mini-SPOX will not mate with a 2.54 mm pin header cleanly: buy both ends from one family
  if you ever make cables.'
