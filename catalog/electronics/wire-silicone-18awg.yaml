notes: 'NOT verified: no manufacturer datasheet (seller claims only) and neither vendor showed a stock count. mass_kg is PER METRE and an ESTIMATE (0.82 mm2 copper 7.3 g/m + silicone, OD not listed).
  Ampacity: Powerstream "chassis wiring" 16 A is for wire in free air, not in a bundle; Engineering ToolBox lists 9.5 A for single-core 18 AWG (PVC, 30 C). The R1 feeds are sized against the 16 A figure.
  The 18 AWG feed segments carry up to 4 A in the R1 star (leg total) so the stricter 9.5 A figure still has margin; the 16 AWG trunk is the part to check.'
