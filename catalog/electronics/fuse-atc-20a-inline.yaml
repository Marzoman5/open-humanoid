notes: 'Sizing: a 15 A ATO survives a single ~1 s burst at 16 A only just (107% of rating, I2t 256 < 340 A2s) and derates ~25% in a hot enclosure, so 15 A is marginal for the all-leg
  stall transient. Recommend 20 A (opens in 0.15-5 s at 40 A). The fuse protects the 14 AWG wire and XT60 (~30 A), not the servos. ATO is obsolescent (ATOF replaces it). At 2S the same
  power draws ~1.6x the current: recheck against the R10 peak current for B. Breaker alternative: Eaton Shortstop 15 A $3.40 (hold/trip curve not verified).'
