  (DEV-30447, $50.00, out of stock); https://www.pishop.us/product/raspberry-pi-5-1gb/ (SKU 9021-Pi5-1GB, $45.00, stock not shown). CanaKit sells it only as a $104.95 kit. Launch and price:
