    legs: A routes the 4 leg feeds and the leg bus data from the pocket to each leg segment
  power_topology: {pack: 'Tattu 3S 1300 (72 x 36 x 22; maintainer v4) in the torso back (B), behind the Pi 5, removed backward', switch_fuse_star: 'XT60
