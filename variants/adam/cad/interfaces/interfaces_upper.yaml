          \ bend radius >= 15 mm (4 x \xD8)", 1 x arm/head bus data lead (3 x 26 AWG) from the arm/head adapter (pocket) back up to the torso
          chain, '1 x IMU cable, 4 x 28 AWG twisted (BNO085 in UART-RVC or I2C mode: 3V3, GND, 2 signals), Pi (torso) -> IMU (pocket)']
      bundle_d_mm: 13
