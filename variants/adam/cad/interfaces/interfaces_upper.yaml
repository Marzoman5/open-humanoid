      here, so (maintainer, v3) the Pi 5, its buck, the star and the fuse go in the TORSO by the pack (B; pack = Tattu 3S 1300, maintainer v4).
      The pocket holds the BNO085 IMU and BOTH bus adapters (v4: the torso has no room for the arm/head adapter; both buses stay short to their
      servo groups). The buck stays with the Pi (5 V / 5 A must not run through the waist).'
