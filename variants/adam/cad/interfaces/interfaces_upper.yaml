region: 'B (upper body: waist yaw and everything it carries)'
contract_ab:
  schema: contract-ab/0.1
  status: 'published 2026-10-19, v4.2 (pocket z 343.6..378.6: 35 mm, top meets the 3.1 mm frame-margin rule under the R2a outer top 381.7)'
  owner: 'region B (cad-upper); consumer: region A'
  waist:
    joint: waist_yaw
    axis:
      origin: [0.0, 0.0, 382.0]
      direction: [0, 0, 1]
    split: 'Turntable split: A owns the STATOR (the waist STS3215 body, its housing in the pelvis, and the seat of the 6805ZZ ring bearing''s
      OUTER race). B owns the ROTOR (the horn, the torso hub whose spigot carries the INNER race, everything above).'
    servo:
      actuator: sts3215-12v
      host_link: pelvis
      frame:
        origin: [0.0, 0.0, 382.0]
        z_dir: [0, 0, 1]
        x_dir: [1, 0, 0]
      body_world:
        x: [-10.11, 35.11]
        y: [-12.36, 12.36]
        z: [347.0, 382.0]
      connectors: '2 x 5264 on the BACK face (z = 347), x 12.5..22 from the axis: A''s cover needs a plug window there + 12 mm plug room below'
      horn: "stock round horn (\xD819.2 x 2.5) fitted by B; its underside is at z 381.75, its top at 384.25 (B's hub sits on it)"
      a_housing_rules: 'Housing per servo_housing (slip 0.15/side, walls >= 2.4) with a HORN RELIEF: nothing of A within r 10.6 of the axis above
        z 380.7 (the horn rim needs the 1.0 mm moving gap; vendor CAD). The housing top must not rise above z 382.15 anywhere except the bearing
        ring.'
    bearing:
      part: 6805ZZ (25 x 37 x 7, ISO 15), deep-groove thin-section; carries the torso's radial load and fall moments so the servo spline does
        not
      outer_race_seat_A:
        bore_d: 37.1
        seat_z: [383.75, 390.75]
        shoulder:
          z: [382.15, 383.75]
          inner_d: 33.8
          note: supports the outer ring only (outer ring land d 33.5..37); keep d >= 33.8 free so the inner ring and B's spigot pass
        min_wall_around_seat: 2.0
        ring_top_z_max: 390.75
      inner_race_B: hub spigot d 25 (inner race slip/press), bore d 19.8 around the horn; hub shoulder on the race top at z 390.75 (d 25..28.6)
      axial_load_path: 'torso weight: hub shoulder -> inner race -> balls -> outer race -> A''s shoulder. Lift-off: horn screws (M3 centre + 4
        x M2).'
    keepouts_for_A:
    - name: rotor_sweep
      shape: cylinder
      axis: [0, 0, 1]
      centre: [0, 0, 0]
      r: 44.0
      z: [391.75, 402.0]
      note: 'torso floor + hub sweep (+-60 deg): nothing of A above z 390.75 inside r 44 (waist shell band z 376..402 is B''s)'
    - name: spigot
      shape: cylinder
      centre: [0, 0, 0]
      r: 13.5
      z: [382.75, 391.75]
      note: rotating spigot + inner race + horn; 1.0 mm moving gap included
    design_loads_at_bearing: {upper_body_mass_kg: 1.6, standing_axial_N: 16.2, fall_case: 'forward fall onto the arms/chest: 30 g peak on the
        upper-body COM (research/methods/d drop-load rule, 0.15 m above the waist)', fall_moment_Nm: 72.8, fall_radial_N: 486.0, servo_stall_torque_Nm: 2.94}
  electronics_pocket:
    owner: B designs the tray and its contents; A provides the pocket, the mounting face and keeps the zone free (maintainer, v3)
    host_link: pelvis
    zone:
      x: [-44.0, -16.0]
      y: [-57.0, 57.0]
      z: [343.6, 378.6]
    zone_note: 'v4.2: z 343.6..378.6 (region A: yaw-bracket rib tops out at 339.0, R2a outer top 381.7 - 3.1 mm rule = 378.6). v4.1: 35 mm because
      a 42 x 33 x ~12 adapter cannot be tilted into 33 mm (its height only grows when tilted); vertical it needs 33 + 2 x 1 mm. The only volume
      region A can give at R2a depth: the hip-yaw links sweep the lower pelvis rear across the full width (yaw +-45 deg). A Pi 5 does not fit
      here, so (maintainer, v3) the Pi 5, its buck, the star and the fuse go in the TORSO by the pack (B; pack = Tattu 3S 1300, maintainer v4).
      The pocket holds the BNO085 IMU and BOTH bus adapters (v4: the torso has no room for the arm/head adapter; both buses stay short to their
      servo groups). The buck stays with the Pi (5 V / 5 A must not run through the waist).'
    mounting_face_A:
      plane_x: -16.0
      normal: [-1, 0, 0]
      note: flat vertical face (A's rear bulkhead) the tray seats on
    inserts_A:
      thread: M3
      points_yz:
      - [-52.0, 349.6]
      - [52.0, 349.6]
      - [-52.0, 372.6]
      - [52.0, 372.6]
      min_pad_d: 10.0
    screws: 4 x M3 x 10 low-head through the tray plate (2.4) into A's inserts, installed from the back with the back shell off
    contents_B:
    - part: imu-bno085
      at: [-26.0, 0.0, 361.1]
      frame: board standing in the y-z plane (normal -x); chip axes remapped to pelvis x/y/z in software
      isolation: 4 x M2.5 silicone anti-vibration grommets (FPV flight-controller type), 6 mm stand-off from the tray plate
      note: 'on the centre line, 86 mm above the hip axis, 26 mm behind the waist axis, rigid with the pelvis: the runtime''s IMU site (docs/software.md)'
    - {part: waveshare-bus-servo-adapter, role: leg bus (12 servos), at: 'y -55..-13, board VERTICAL in the y-z plane (33 tall: z 344.6..377.6,
        1 mm above and below), components back (x -22..-34) on 2 stand-off posts; USB from the Pi in the torso'}
    - {part: waveshare-bus-servo-adapter, role: arm/head/waist bus (11 servos), at: 'y +13..+55, mirror of the leg adapter (vertical); USB from
        the Pi; its bus data goes back up through the waist opening'}
    free_for_A: none in the pocket (v4); A's leg-feed splits (WAGO 221-413 taps) go outside the zone
    ventilation: none needed (adapter + IMU < 0.3 W)
    mass_kg: 0.075
  cable_pass_throughs:
    waist:
      route: 'behind the waist servo: torso floor slot (B) at r 18..32 behind the axis over an arc of +-75 deg; flat service loop in the gap z
        382..391 on a 25 mm radius with 2 x the 60 deg twist of slack (~55 mm)'
      a_opening:
        x: [-32.0, -16.0]
        y: [-20.0, 20.0]
        z_from: 380.0
        note: open from the pelvis top down into the pocket; edges rounded r >= 2
      bundle: ['4 x leg power feeds, 18 AWG silicone pairs (star in the torso -> the 4 leg segments; R1 7.2: fed at the STS3250s); the leg adapter''s
          own power is a tap on one feed inside the pocket', "2 x USB 2.0, slim (\xD8 <= 3.5 mm), Pi (torso) -> the two bus adapters (pocket);\
          \ bend radius >= 15 mm (4 x \xD8)", 1 x arm/head/waist bus data lead (3 x 26 AWG) from the arm/head adapter (pocket) back up to the
          torso chain, '1 x IMU cable, 4 x 28 AWG twisted (BNO085 in UART-RVC or I2C mode: 3V3, GND, 2 signals), Pi (torso) -> IMU (pocket)',
        the waist servo's own bus lead (arm/head chain) also drops through the opening to the waist servo's back-face connector]
      bundle_d_mm: 13
      twist_check: "Flat spiral loop in the 9 mm gap (z 382..391), laid on r 25 around the axis (outside the r 13.5 spigot keep-out, inside the\
        \ floor slot r 18..32). At +-60 deg yaw the torso-side anchor moves 26 mm along the arc; slack = 2 x 26 + 3 = 55 mm, so the loop radius\
        \ stays between 21 and 29 mm: >= the USB minimum bend radius 15 mm (4 x \xD8 3.5) at both limits. Bundle 13 mm round -> laid as two flat\
        \ layers (6 + 6 mm) in the 9 mm gap; the slot width (14 mm) passes it. B re-checks with the loop modelled in its ROM sweep."
    legs: A routes the 4 leg feeds and the leg bus data from the pocket to each leg segment
  power_topology: {pack: 'Tattu 3S 1300 (72 x 36 x 22; maintainer v4) in the torso back (B), behind the Pi 5, removed backward', switch_fuse_star: 'XT60
      -> switch -> 18 A ATO fuse (R1 post-sign-off: 20 A had no margin on the WAGO 20 A rating) -> WAGO star (4 x 221-415) in the torso (B)',
    feeds_to_A: 4 leg segment pairs through the waist opening, compute: Pi 5 + Active Cooler + buck (Pololu D36V50F5) in the torso by the pack
      (B)}
  bus_topology: {adapters: 2, rate_hz: 100}
  arms: {display_cant_deg_min: 14.0, keepout_for_A: the arm sweep at shoulder roll >= 14 deg (abducted) must stay clear of the pelvis/hip shells;
      B publishes the swept volume with its export}
