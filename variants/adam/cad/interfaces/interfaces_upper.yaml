region: 'B (upper body: the torso bolted to the pelvis deck and everything it carries)'
fixed_joints:
  torso_mount:
    parent_link: pelvis
    child_link: torso_link
    type: fixed
    origin_mm: *id001
    note: bolted torso-pelvis mount, contract_ab.yaml v5 (no waist yaw; DOF 22)
contract_ab:
  schema: contract-ab/0.1
  status: 'published 2026-10-19, v5.1 (NO waist joint: torso bolted to the pelvis deck at z 382.15; v5.1: dowels at (17, +-15), A''s bolting cavity,
    B''s mount wrench and mount checks)'
  owner: 'region B (cad-upper); consumer: region A'
  torso_mount:
    joint: fixed (torso_link is a fixed child of the pelvis; no waist servo, no 6805ZZ, no stops)
    why: 'Region A: the 6805ZZ seat fails at the fall tilt (static SF ~0.5-0.7) and no off-the-shelf bearing fits the envelope. Walking, turning,
      push recovery (SIL) and the pickup planner never use the waist (packaging study L2: margins unchanged or slightly better).'
    plane:
      z: 382.15
      normal: [0, 0, 1]
      note: A's deck top = B's pad underside, flat contact, no gap; the torso_link frame origin is (0, 0, 382.15)
    deck_A:
      x: [-12.7, 45.0]
      y: [-18.99, 18.99]
      top_z: 382.15
      note: A's flat deck; |y| <= 18.99 for the hip-yaw cover lift-off (A, v5.1). Nothing of A above z 382.15 under the torso
    bolting_cavity_A:
      x: [-9.0, 32.0]
      y: [-17.2, 17.2]
      open: below
      note: 'A (v5.1): the old waist-servo volume, kept free for the key; the 4 heads are inside it'
    pad_B:
      outline:
        x: [-12.7, 32.5]
        y: [-22.0, 22.0]
        corner_r: 6.0
      z: [382.15, 391.75]
      note: 'x <= 32.5: the R2a waist band (shrunk 3.1 mm) allows x <= 33.5 at |y| 13 for z 384..394, so nothing of B (pad, nut traps) may reach
        A''s x 45 deck edge; the contact patch is the overlap x -12.7..32.5, |y| <= 19 (~860 mm2).'
    bolts:
      count: 4
      points_xy:
      - [-4.0, 13.0]
      - [-4.0, -13.0]
      - [26.0, 13.0]
      - [26.0, -13.0]
      change_vs_A_proposal: 'A proposed (38, +-13) for the front pair. At x 38 B''s nut traps (9.4 mm washer seat) would sit 5-9 mm OUTSIDE the
        waist band (z 384..394 allows x <= 33.5 at |y| 13). Moved to x 26: still inside the freed waist-servo cavity (old body x -10..35), so
        A''s upward key access is unchanged. A to confirm.'
      screw: ISO 4762 M3 socket head, driven UPWARD from inside the pelvis (2.5 mm ball-end key, reaches with the legs on), ISO 7089 washer under
        the head (A side)
      length: "A deck thickness + 11 mm (M3 x 16 for a 5 mm deck); the tip ends in B's clearance hole (\xD83.4 up to z 394.5)"
      nut_B: "captive in a side-entry trap in B's pad (heat-set inserts pull out at ~300 N, the bolts see up to ~850 N): ISO 7093 large washer\
        \ (\xD89 x 0.8) seat z 387.15..388.05 (slot 9.4 wide) under an ISO 4032 M3 hex nut, z 388.05..390.65 (slot 5.7 across flats, anti-rotation);\
        \ 5.0 mm of solid pad under the washer (pull-through), >= 5.8 mm of solid above the nut. Slots open outward (toward |y| = 22)."
      tool_corridor_A: "\xD88 x 30 mm free below each head (dfm access M3) inside the pelvis, with the pocket full and the legs on (A)"
    dowels:
      part: "2 x \xD84 x 12 ISO 8734 hardened dowel pins (torque and shear; the bolts sit in clearance holes and carry no shear)"
      points_xy:
      - [17.0, 15.0]
      - [17.0, -15.0]
      engagement: "6 mm in A (A's fit), 6 mm in B: hole \xD84.0 (printed, reamed), z 382.15..389.0 (0.85 mm relief at the end)"
      note_v5_1: 'resolved: A moved the dowels to |y| 15 (deck wall 2 mm); B''s pad holes follow'
    assembly_order: 'A: pelvis with the pocket full (tray, IMU, both adapters, plugged). B: torso frame lowered onto the dowels (washer + nut
      slid into the four traps first); 4 bolts driven up from inside the pelvis. Then the shoulder servos, Pi, pack etc. (B). Legs after (A),
      or before: the ball-end key reaches.'
    design_loads:
      method: 'variants/adam/cad/upper/tools/strength_upper.py: the wrench the torso_link subtree passes across the mount plane, about (0, 0,
        382.15), for every protected fall case (contact F = phi E / d x k_peak = 390 N on the extreme point of each exposed link; inertial n =
        24 g), each scaled so that no SERVO joint it crosses exceeds 2 x stall. With no waist servo the yaw torque and the tilt are no longer
        capped anywhere: they reach the mount in full. Plus every stall case (arm joints, neck, gripper) and the lift-by-hand case.'
      a_estimate_n_per_bolt: 850
      b_result_v5_1:
        worst_tilt: {nm: 21.9, case: 'side fall onto the opposite shoulder bracket (390 N, uncapped)', radial_n: 392.5, yaw_nm: 0.4}
        worst_yaw: {nm: 9.8, case: forward fall onto a shoulder roll / pitch link, tilt_nm: 8.6, radial_n: 150.0, note: 'the ~25 N*m estimate
            (390 N x 65 mm) is limited by the shoulder-pitch back-drive (2 x stall), which the fall policy applies to every case crossing that
            servo'}
        worst_radial: {n: 392.5, case: forward / side fall onto the torso, tilt_nm: 17.9, yaw_nm: 6.3}
        worst_axial: {n: 381.7, case: fall onto the torso from above (down contact), tilt_nm: 5.0}
        stall: {tilt_nm: 7.2, yaw_nm: 1.7, radial_n: 58.0, case: neck yaw at stall against a blocked head}
        handling: {tilt_nm: 3.8, axial_n: 53.9, case: lifted by one claw}
        rigid_fall_informational: {tilt_nm: 223.0, yaw_nm: 62.0, radial_n: 1308.0, note: 'no bumper (10 mm stop absent): informational, like every
            rigid case; the TPU bumper zones are what the protected numbers rely on'}
        bolt_tension_max_n: {fall: 464.0, stall: 199.0, note: 'toolkit bolted-joint model: 4 bolts in tension + compression patch on the deck
            overlap; x SF 2 = 928 N (A''s 850 N estimate confirmed, +9 %)'}
        dowel_shear_max_n: {fall: 632.0, note: 'per dowel: in-plane 393 N / 2 + 13.1 N*m about the dowel centroid / (2 x 15 mm), side fall onto
            the torso; bolts in clearance holes carry no shear'}
        checks_B_at_sf2: {nut_trap_pull_through: 4.36, nut_trap_bearing_iso7093: 3.36, dowel_bearing_in_pad: 1.09, dowel_shear_steel: 5.97, verdict: PASS}
        for_A: check the deck, the bolt heads (ISO 7089 washers) and A's 6 mm dowel engagement at the same wrench; A's dowel bearing sees the
          same 632 N per dowel
    keepouts:
    - {name: below_plane_for_B, note: nothing of B below z 382.15}
    - {name: above_plane_for_A, note: nothing of A above z 382.15 inside the waist band (bolt heads are under the deck)}
  electronics_pocket:
    owner: B designs the tray and its contents; A provides the pocket, the mounting face and keeps the zone free (maintainer, v3)
    host_link: pelvis
    zone:
      x: [-44.0, -16.0]
      y: [-57.0, 57.0]
