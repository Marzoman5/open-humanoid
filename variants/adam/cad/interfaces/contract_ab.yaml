# A <-> B contract of Adam v2 (frozen concept V2a-0p55-longarm, ADR 0015 + amendment). Task T-20261019-f6e2 (region B, cad-upper).
# Region A (pelvis + legs, T-20261019-3d4d) builds the pelvis TO THIS FILE. Units mm / deg / N / N*m; world frame at the zero pose
# (x forward, y left, z up; z = 0 at the sole). Every number below is either a frozen-concept hard point (variants/adam/design/profiles.yaml,
# R1 landmarks), a vendor-CAD servo dimension (catalog/actuators/sts3215-12v.yaml), a dfm.yaml rule, or a stated design choice of region B.
# Change requests go through the commander; B re-runs its checks against any change.
schema: contract-ab/0.1
status: "published 2026-10-19, v5 (NO waist joint: the torso is bolted rigidly to the pelvis deck at z 382.15; DOF 23 -> 22)"
owner: "region B (cad-upper); consumer: region A"

# --------------------------------------------------------------------------------------------------------------------------------
torso_mount:                             # v5 (maintainer 2026-10-19): the waist yaw joint is REMOVED. History: interfaces/README.md
  joint: "fixed (torso_link is a fixed child of the pelvis; no waist servo, no 6805ZZ, no stops)"
  why: >-
    Region A: the 6805ZZ seat fails at the fall tilt (static SF ~0.5-0.7) and no off-the-shelf bearing fits the envelope. Walking,
    turning, push recovery (SIL) and the pickup planner never use the waist (packaging study L2: margins unchanged or slightly better).
  plane: {z: 382.15, normal: [0, 0, 1], note: "A's deck top = B's pad underside, flat contact, no gap; the torso_link frame origin is (0, 0, 382.15)"}
  deck_A: {x: [-12.7, 45.0], y: [-19.0, 19.0], top_z: 382.15, note: "A's flat deck (A's proposal). Nothing of A above z 382.15 under the torso"}
  pad_B:
    outline: {x: [-12.7, 32.5], y: [-22.0, 22.0], corner_r: 6.0}
    z: [382.15, 391.75]                   # solid pad, part of torso_frame, joins the floor (391.75..396.5)
    note: >-
      x <= 32.5: the R2a waist band (shrunk 3.1 mm) allows x <= 33.5 at |y| 13 for z 384..394, so nothing of B (pad, nut traps) may
      reach A's x 45 deck edge; the contact patch is the overlap x -12.7..32.5, |y| <= 19 (~860 mm2).
  bolts:
    count: 4
    points_xy: [[-4.0, 13.0], [-4.0, -13.0], [26.0, 13.0], [26.0, -13.0]]
    change_vs_A_proposal: >-
      A proposed (38, +-13) for the front pair. At x 38 B's nut traps (9.4 mm washer seat) would sit 5-9 mm OUTSIDE the waist band
      (z 384..394 allows x <= 33.5 at |y| 13). Moved to x 26: still inside the freed waist-servo cavity (old body x -10..35), so A's
      upward key access is unchanged. A to confirm.
    screw: "ISO 4762 M3 socket head, driven UPWARD from inside the pelvis (2.5 mm ball-end key, reaches with the legs on), ISO 7089 washer under the head (A side)"
    length: "A deck thickness + 11 mm (M3 x 16 for a 5 mm deck); the tip ends in B's clearance hole (Ø3.4 up to z 394.5)"
    nut_B: >-
      captive in a side-entry trap in B's pad (heat-set inserts pull out at ~300 N, the bolts see up to ~850 N): ISO 7093 large washer
      (Ø9 x 0.8) seat z 387.15..388.05 (slot 9.4 wide) under an ISO 4032 M3 hex nut, z 388.05..390.65 (slot 5.7 across flats, anti-rotation);
      5.0 mm of solid pad under the washer (pull-through), >= 5.8 mm of solid above the nut. Slots open outward (toward |y| = 22).
    tool_corridor_A: "Ø8 x 30 mm free below each head (dfm access M3) inside the pelvis, with the pocket full and the legs on (A)"
  dowels:
    part: "2 x Ø4 x 12 ISO 8734 hardened dowel pins (torque and shear; the bolts sit in clearance holes and carry no shear)"
    points_xy: [[17.0, 17.0], [17.0, -17.0]]
    engagement: "6 mm in A (A's fit), 6 mm in B: hole Ø4.0 (printed, reamed), z 382.15..389.0 (0.85 mm relief at the end)"
    note_for_A: "at |y| 17 a Ø4 hole leaves ~0 mm of wall to A's deck edge at |y| 19 (B's pad goes to |y| 22, 3 mm wall): A to widen the deck locally or move the dowels to |y| <= 15"
  assembly_order: "A: pelvis with the pocket full (tray, IMU, both adapters, plugged). B: torso frame lowered onto the dowels (washer + nut slid into the four traps first); 4 bolts driven up from inside the pelvis. Then the shoulder servos, Pi, pack etc. (B). Legs after (A), or before: the ball-end key reaches."
  design_loads:                         # standard fall policy (docs/strength.md) and stall; B's run in variants/adam/cad/upper/strength/waist_design_load.json
    method: >-
      variants/adam/cad/upper/tools/strength_upper.py: the wrench the torso_link subtree passes across the mount plane, about (0, 0, 382.15),
      for every protected fall case (contact F = phi E / d x k_peak = 390 N on the extreme point of each exposed link; inertial n = 24 g),
      each scaled so that no SERVO joint it crosses exceeds 2 x stall. With no waist servo the yaw torque and the tilt are no longer
      capped anywhere: they reach the mount in full. Plus every stall case (arm joints, neck, gripper) and the lift-by-hand case.
    a_estimate_n_per_bolt: 850          # A's estimate (side tilt, SF 2), before B's run
    b_result: "pending (B's strength run on the v5 geometry; this file is updated with the numbers)"
  keepouts:
    - {name: below_plane_for_B, note: "nothing of B below z 382.15"}
    - {name: above_plane_for_A, note: "nothing of A above z 382.15 inside the waist band (bolt heads are under the deck)"}

# --------------------------------------------------------------------------------------------------------------------------------
electronics_pocket:
  owner: "B designs the tray and its contents; A provides the pocket, the mounting face and keeps the zone free (maintainer, v3)"
  host_link: pelvis
  zone: {x: [-44.0, -16.0], y: [-57.0, 57.0], z: [343.6, 378.6]}
  zone_note: >-
    v4.2: z 343.6..378.6 (region A: yaw-bracket rib tops out at 339.0, R2a outer top 381.7 - 3.1 mm rule = 378.6). v4.1: 35 mm because a 42 x 33 x ~12 adapter cannot be tilted into 33 mm (its height only grows when tilted); vertical
    it needs 33 + 2 x 1 mm. The only volume region A can give at R2a depth: the hip-yaw links sweep the lower pelvis rear across the full width (yaw +-45 deg).
    A Pi 5 does not fit here, so (maintainer, v3) the Pi 5, its buck, the star and the fuse go in the TORSO by the pack (B; pack = Tattu 3S
    1300, maintainer v4). The pocket holds the BNO085 IMU and BOTH bus adapters (v4: the torso has no room for the arm/head adapter; both
    buses stay short to their servo groups). The buck stays with the Pi (5 V / 5 A must not run through the waist).
  mounting_face_A: {plane_x: -16.0, normal: [-1, 0, 0], note: "flat vertical face (A's rear bulkhead) the tray seats on"}
  inserts_A:                              # heat-set M3 inserts in A's bulkhead, axis -x (screws from the back; tool corridor along +x, 30 mm free)
    thread: M3
    points_yz: [[-52.0, 349.6], [52.0, 349.6], [-52.0, 372.6], [52.0, 372.6]]
    min_pad_d: 10.0
  screws: "4 x M3 x 10 low-head through the tray plate (2.4) into A's inserts, installed from the back with the back shell off"
  contents_B:
    - {part: imu-bno085, at: [-26.0, 0.0, 361.1], frame: "board standing in the y-z plane (normal -x); chip axes remapped to pelvis x/y/z in software",
       isolation: "4 x M2.5 silicone anti-vibration grommets (FPV flight-controller type), 6 mm stand-off from the tray plate",
       note: "on the centre line, 86 mm above the hip axis, 26 mm behind the waist axis, rigid with the pelvis: the runtime's IMU site (docs/software.md)"}
    - {part: waveshare-bus-servo-adapter, role: "leg bus (12 servos)", at: "y -55..-13, board VERTICAL in the y-z plane (33 tall: z 344.6..377.6, 1 mm above and below), components back (x -22..-34) on 2 stand-off posts; USB from the Pi in the torso"}
    - {part: waveshare-bus-servo-adapter, role: "arm/head bus (10 servos)", at: "y +13..+55, mirror of the leg adapter (vertical); USB from the Pi; its bus data goes back up through the waist opening"}
  free_for_A: "none in the pocket (v4); A's leg-feed splits (WAGO 221-413 taps) go outside the zone"
  ventilation: "none needed (adapter + IMU < 0.3 W)"
  mass_kg: 0.075                          # 2 adapters 20 g + IMU 3 g + tray ~35 g + grommets/standoffs ~5 g + local cables ~12 g (estimate)

# --------------------------------------------------------------------------------------------------------------------------------
cable_pass_throughs:
  waist:
    route: "v5 (fixed, no loop): U-notch in the back edge of B's torso floor, x -27..-19.2, |y| <= 16 (z 391.75..396.5), behind B's pad (x >= -12.7), straight down into A's opening"
    a_opening: {x: [-32.0, -16.0], y: [-20.0, 20.0], z_from: 380.0, note: "open from the pelvis top down into the pocket; edges rounded r >= 2"}
    bundle:
      - "4 x leg power feeds, 18 AWG silicone pairs (star in the torso -> the 4 leg segments; R1 7.2: fed at the STS3250s); the leg adapter's own power is a tap on one feed inside the pocket"
      - "2 x USB 2.0, slim (Ø <= 3.5 mm), Pi (torso) -> the two bus adapters (pocket); bend radius >= 15 mm (4 x Ø)"
      - "1 x arm/head bus data lead (3 x 26 AWG) from the arm/head adapter (pocket) back up to the torso chain"
      - "1 x IMU cable, 4 x 28 AWG twisted (BNO085 in UART-RVC or I2C mode: 3V3, GND, 2 signals), Pi (torso) -> IMU (pocket)"
    bundle_d_mm: 13
    twist_check: "v5: none (no waist yaw); the bundle passes the notch flat (7.8 x 32 mm opening, ~30 % fill, a USB-A overmold 16 x 8 passes)"
  legs: "A routes the 4 leg feeds and the leg bus data from the pocket to each leg segment"
power_topology:
  pack: "Tattu 3S 1300 (72 x 36 x 22; maintainer v4) in the torso back (B), behind the Pi 5, removed backward"
  switch_fuse_star: "XT60 -> switch -> 18 A ATO fuse (R1 post-sign-off: 20 A had no margin on the WAGO 20 A rating) -> WAGO star (4 x 221-415) in the torso (B)"
  feeds_to_A: "4 leg segment pairs through the waist opening"
  compute: "Pi 5 + Active Cooler + buck (Pololu D36V50F5) in the torso by the pack (B)"
bus_topology:
  adapters: 2                             # both in the pelvis pocket: adapter 1 = legs (12 servos), adapter 2 = arms + head (10 servos; v5: no waist servo)
  rate_hz: 100
arms:
  display_cant_deg_min: 14.0              # ADR 0015 amendment; profiles use 19.5
  keepout_for_A: "the arm sweep at shoulder roll >= 14 deg (abducted) must stay clear of the pelvis/hip shells; B publishes the swept volume with its export"
