# A <-> B contract of Adam v2 (frozen concept V2a-0p55-longarm, ADR 0015 + amendment). Task T-20261019-f6e2 (region B, cad-upper).
# Region A (pelvis + legs, T-20261019-3d4d) builds the pelvis TO THIS FILE. Units mm / deg / N / N*m; world frame at the zero pose
# (x forward, y left, z up; z = 0 at the sole). Every number below is either a frozen-concept hard point (variants/adam/design/profiles.yaml,
# R1 landmarks), a vendor-CAD servo dimension (catalog/actuators/sts3215-12v.yaml), a dfm.yaml rule, or a stated design choice of region B.
# Change requests go through the commander; B re-runs its checks against any change.
schema: contract-ab/0.1
status: "published 2026-10-19, v4.4 (captured waist flange between A's lower stop ring and A's upper retaining ring; design load from the G-strength fall policy)"
owner: "region B (cad-upper); consumer: region A"

# --------------------------------------------------------------------------------------------------------------------------------
waist:
  joint: waist_yaw                       # concept range [-60, 60] deg; parent = pelvis (A), child = torso (B: waist_yaw_link)
  axis: {origin: [0.0, 0.0, 382.0], direction: [0, 0, 1]}
  split: >-
    Turntable split: A owns the STATOR (the waist STS3215 body, its housing in the pelvis, and the seat of the 6805ZZ ring bearing's
    OUTER race). B owns the ROTOR (the horn, the torso hub whose spigot carries the INNER race, everything above).
  servo:
    actuator: sts3215-12v
    host_link: pelvis
    frame: {origin: [0.0, 0.0, 382.0], z_dir: [0, 0, 1], x_dir: [1, 0, 0]}   # origin = top of the case envelope on the output axis; body below
    body_world: {x: [-10.11, 35.11], y: [-12.36, 12.36], z: [347.0, 382.0]}   # vendor CAD envelope (45.22 x 24.72 x 35)
    connectors: "2 x 5264 on the BACK face (z = 347), x 12.5..22 from the axis: A's cover needs a plug window there + 12 mm plug room below; the back PA3 screw head (Ø5.5) turns with the torso: the cover's centre hole must be >= Ø8.1 (1.0 mm moving gap)"
    horn: "stock round horn (Ø19.2 x 2.5) fitted by B; its underside is at z 381.75, its top at 384.25 (B's hub sits on it)"
    a_housing_rules: >-
      Housing per servo_housing (slip 0.15/side, walls >= 2.4) with a HORN RELIEF: nothing of A within r 10.6 of the axis above z 380.7
      (the horn rim needs the 1.0 mm moving gap; vendor CAD). The housing top must not rise above z 382.15 anywhere except the bearing ring.
  bearing:
    part: "6805ZZ (25 x 37 x 7, ISO 15), deep-groove thin-section; carries the torso's radial load and fall moments so the servo spline does not"
    outer_race_seat_A:
      bore_d: 37.10                       # OD + 0.10 (dfm bearing_seat.seat_d_over_od)
      seat_z: [383.75, 390.75]            # race occupies this band
      shoulder: {z: [382.15, 383.75], inner_d: 33.8, note: "supports the outer ring only (outer ring land d 33.5..37); keep d >= 33.8 free so the inner ring and B's spigot pass"}
      min_wall_around_seat: 2.0           # dfm bearing_seat.wall -> ring OD >= 41.1
      ring_top_z_max: 390.75              # flush with the race top; B's torso floor starts at 391.75 (1.0 moving gap)
    inner_race_B: "hub spigot d 25 (inner race slip/press), bore d 19.8 around the horn; hub shoulder on the race top at z 390.75 (d 25..28.6)"
    axial_load_path: "torso weight: hub shoulder -> inner race -> balls -> outer race -> A's shoulder. Lift-off: horn screws (M3 centre + 4 x M2)."
  captured_flange:                      # v4.4 (commander decision): tilt in any direction = COMPRESSION on two opposite stops; no tension in the bearing or horn
    flange_B: {r: [30.0, 40.0], z: [391.75, 395.75], thickness: 4.0, part: torso_frame, note: "continuous ring = the floor's outer annulus; nothing of B beyond r 40 below z 400.75"}
    lower_stop_ring_A: {r: [30.0, 44.0], top_z: 390.75, gap_to_flange: 1.0}
    upper_retaining_ring_A: {r: [30.0, 44.0], z: [396.75, 399.75], gap_to_flange: 1.0, note: "max thickness 3.0: B keeps clear up to z 400.75"}
    posts_A: {r: [41.0, 44.0], count: 4, centres_deg: [45, 135, 225, 315], note: "join the two rings outside the flange (1.0 mm from its r 40)"}
    screws_A: "4 x M3 joining the upper ring to the posts / lower ring at r 42.5 (A's pattern), with PTFE or nylon washers allowed as wear faces on both stop faces"
    clearance_zone_B: {r: [29.0, 46.0], z: [395.75, 400.75], note: "B keeps it free at every yaw (verified in B's gate); and r 40..46 free from z 390.75"}
    cable_loop: "r 21..29 in the floor slot r 18..29.5, below z 391: inside every ring and post (>= 1 mm) at any yaw"
    access_and_order: >-
      1) A: stator, bearing, lower stop ring + posts. 2) B: torso lowered onto the horn and the 6805 inner race (the flange lands 1.0 mm
      above the lower ring); horn screws through the floor access holes; inner-race retaining clip. 3) A: upper retaining ring installed
      WITH THE TORSO IN PLACE as two C-shaped halves slid in radially over the flange onto the posts. B HAS NO VERTICAL TOOL ACCESS from
      above at r 30..46 at any yaw (shoulder cradles, Pi, front electronics sit there), so the ring screws must be driven from BELOW
      (through the lower ring into inserts in the upper ring, from inside the pelvis) or the halves locked by a printed twist/bayonet;
      A picks one and B re-runs its access check against it.
    inner_race_clip_B: "retains the 6805 inner race on the hub spigot for normal (non-fall) axial loads only"
  design_loads_at_waist:                # v4.4: from the toolkit's standard fall policy (docs/strength.md), not an ad-hoc g level
    method: >-
      variants/adam/cad/upper/tools/strength_upper.py (waist_design_load.json): every protected fall case of the upper body
      (contact F = phi E / d x k_peak = 0.25 x 10.4 J / 0.010 m x 1.5 = 390 N on the extreme point of each exposed link; inertial
      n = dh / d = 24 g), each scaled so no joint it crosses exceeds 2 x stall (servo back-drive), EXCEPT the waist tilt, which the
      captured flange carries (no side-moment cap at the waist). Robot 4.4 kg / 0.55 m (R1 package), CoM 0.55 H, lying 0.06 m.
    worst_tilt_nm: 22.0                 # side fall onto a shoulder bracket (390 N, unscaled), about 56 mm above the waist
    worst_radial_n: 392.5
    axial_n: -11.1                      # upper-body weight
    yaw_torque_cap_nm: 5.88             # 2 x STS3215 stall (servo back-drive)
    gated: "SF 2 (fall class): 44 N*m tilt and 785 N radial. As two opposite stop contacts at r ~35 mm: ~630 N each in compression (SF included)"
    supersedes: "v4.3's 72.8 N*m (1.65 kg x 30 g x 0.15 m, ad hoc)"
  keepouts_for_A:
    - {name: rotor_sweep, shape: cylinder, axis: [0, 0, 1], centre: [0, 0, 0], r: 29.0, z: [390.75, 402.0],
       note: "v4.4: inside r 29 nothing of A above z 390.75 (hub, floor, cable slot); r 29..44 is the captured-flange zone (captured_flange above)"}
    - {name: spigot, shape: cylinder, centre: [0, 0, 0], r: 13.5, z: [382.75, 391.75], note: "rotating spigot + inner race + horn; 1.0 mm moving gap included"}
  design_loads_at_bearing: "superseded by design_loads_at_waist (v4.4)"

# --------------------------------------------------------------------------------------------------------------------------------
electronics_pocket:
  owner: "B designs the tray and its contents; A provides the pocket, the mounting face and keeps the zone free (maintainer, v3)"
  host_link: pelvis
  zone: {x: [-44.0, -16.0], y: [-57.0, 57.0], z: [343.6, 378.6]}
  zone_note: >-
    v4.2: z 343.6..378.6 (region A: yaw-bracket rib tops out at 339.0, R2a outer top 381.7 - 3.1 mm rule = 378.6). v4.1: 35 mm because a 42 x 33 x ~12 adapter cannot be tilted into 33 mm (its height only grows when tilted); vertical
    it needs 33 + 2 x 1 mm. The only volume region A can give at R2a depth: the hip-yaw links sweep the lower pelvis rear across the full width (yaw +-45 deg).
    A Pi 5 does not fit here, so (maintainer, v3) the Pi 5, its buck, the star and the fuse go in the TORSO by the pack (B; pack = Tattu 3S
    1300, maintainer v4). The pocket holds the BNO085 IMU and BOTH bus adapters (v4: the torso has no room for the arm/head adapter; both
    buses stay short to their servo groups). The buck stays with the Pi (5 V / 5 A must not run through the waist).
  mounting_face_A: {plane_x: -16.0, normal: [-1, 0, 0], note: "flat vertical face (A's rear bulkhead) the tray seats on"}
  inserts_A:                              # heat-set M3 inserts in A's bulkhead, axis -x (screws from the back; tool corridor along +x, 30 mm free)
    thread: M3
    points_yz: [[-52.0, 349.6], [52.0, 349.6], [-52.0, 372.6], [52.0, 372.6]]
    min_pad_d: 10.0
  screws: "4 x M3 x 10 low-head through the tray plate (2.4) into A's inserts, installed from the back with the back shell off"
  contents_B:
    - {part: imu-bno085, at: [-26.0, 0.0, 361.1], frame: "board standing in the y-z plane (normal -x); chip axes remapped to pelvis x/y/z in software",
       isolation: "4 x M2.5 silicone anti-vibration grommets (FPV flight-controller type), 6 mm stand-off from the tray plate",
       note: "on the centre line, 86 mm above the hip axis, 26 mm behind the waist axis, rigid with the pelvis: the runtime's IMU site (docs/software.md)"}
    - {part: waveshare-bus-servo-adapter, role: "leg bus (12 servos)", at: "y -55..-13, board VERTICAL in the y-z plane (33 tall: z 344.6..377.6, 1 mm above and below), components back (x -22..-34) on 2 stand-off posts; USB from the Pi in the torso"}
    - {part: waveshare-bus-servo-adapter, role: "arm/head/waist bus (11 servos)", at: "y +13..+55, mirror of the leg adapter (vertical); USB from the Pi; its bus data goes back up through the waist opening"}
  free_for_A: "none in the pocket (v4); A's leg-feed splits (WAGO 221-413 taps) go outside the zone"
  ventilation: "none needed (adapter + IMU < 0.3 W)"
  mass_kg: 0.075                          # 2 adapters 20 g + IMU 3 g + tray ~35 g + grommets/standoffs ~5 g + local cables ~12 g (estimate)

# --------------------------------------------------------------------------------------------------------------------------------
cable_pass_throughs:
  waist:
    route: "behind the waist servo: torso floor slot (B) at r 18..32 behind the axis over an arc of +-75 deg; flat service loop in the gap z 382..391 on a 25 mm radius with 2 x the 60 deg twist of slack (~55 mm)"
    a_opening: {x: [-32.0, -16.0], y: [-20.0, 20.0], z_from: 380.0, note: "open from the pelvis top down into the pocket; edges rounded r >= 2"}
    bundle:
      - "4 x leg power feeds, 18 AWG silicone pairs (star in the torso -> the 4 leg segments; R1 7.2: fed at the STS3250s); the leg adapter's own power is a tap on one feed inside the pocket"
      - "2 x USB 2.0, slim (Ø <= 3.5 mm), Pi (torso) -> the two bus adapters (pocket); bend radius >= 15 mm (4 x Ø)"
      - "1 x arm/head/waist bus data lead (3 x 26 AWG) from the arm/head adapter (pocket) back up to the torso chain"
      - "1 x IMU cable, 4 x 28 AWG twisted (BNO085 in UART-RVC or I2C mode: 3V3, GND, 2 signals), Pi (torso) -> IMU (pocket)"
      - "the waist servo's own bus lead (arm/head chain) also drops through the opening to the waist servo's back-face connector"
    bundle_d_mm: 13
    twist_check: >-
      Flat spiral loop in the 9 mm gap (z 382..391), laid on r 25 around the axis (outside the r 13.5 spigot keep-out, inside the floor
      slot r 18..32). At +-60 deg yaw the torso-side anchor moves 26 mm along the arc; slack = 2 x 26 + 3 = 55 mm, so the loop radius stays
      between 21 and 29 mm: >= the USB minimum bend radius 15 mm (4 x Ø 3.5) at both limits. Bundle 13 mm round -> laid as two flat layers
      (6 + 6 mm) in the 9 mm gap; the slot width (14 mm) passes it. B re-checks with the loop modelled in its ROM sweep.
  legs: "A routes the 4 leg feeds and the leg bus data from the pocket to each leg segment"
power_topology:
  pack: "Tattu 3S 1300 (72 x 36 x 22; maintainer v4) in the torso back (B), behind the Pi 5, removed backward"
  switch_fuse_star: "XT60 -> switch -> 18 A ATO fuse (R1 post-sign-off: 20 A had no margin on the WAGO 20 A rating) -> WAGO star (4 x 221-415) in the torso (B)"
  feeds_to_A: "4 leg segment pairs through the waist opening"
  compute: "Pi 5 + Active Cooler + buck (Pololu D36V50F5) in the torso by the pack (B)"
bus_topology:
  adapters: 2                             # both in the pelvis pocket: adapter 1 = legs (12 servos), adapter 2 = arms + head + waist (11 servos)
  rate_hz: 100
arms:
  display_cant_deg_min: 14.0              # ADR 0015 amendment; profiles use 19.5
  keepout_for_A: "the arm sweep at shoulder roll >= 14 deg (abducted) must stay clear of the pelvis/hip shells; B publishes the swept volume with its export"
