# R1 EXPLORATION concept (T-20261019-36f9): one point of the design-space search, DATA for
# `python -m openhumanoid.concept` and variants/adam/design/r1_calibrated.py. It is NOT the recommendation by itself;
# see variants/adam/reviews/R1-concept-2026-10-19.md for which point was chosen and why.
# Height is set by the sweep / r1_calibrated --heights (the value below is the nominal one); packaging floors
# [t0004, cad_foundation] apply (ankle 66 mm, knee 0-115, hip pitch -110/+40, ankle pitch -60/+25 deg).
id: R1x-a20-cut
description: 'Budget cut toward the cap: 3S / 12 V, 5-DOF legs, NO waist yaw, neck yaw+pitch, 3-DOF arms, grippers (the engine mirrors the gripper, so it carries
  TWO; the build has one: 19 servos).'
base: adam
height_m: 0.55
template: humanoid_v2
packaging:
- t0004
- cad_foundation
proportions:
  upper_arm: 0.19
  forearm: 0.21
joints:
- hip_yaw
- hip_roll
- hip_pitch
- knee
- name: ankle_pitch
  range:
  - -80
  - 60
- neck_yaw
- neck_pitch
- shoulder_pitch
- shoulder_roll
- elbow
- gripper
mass_model:
  structure_kg_at_1m: 11.9
actuator_default: sts3215-12v
locomotion:
  walk:
    stance_knee_flex_deg: 40
power:
  pack: lipo-3s-1300-tattu
  charger: charger-skyrc-b6neo
  regulator: buck-pololu-d36v50f5
  compute: rpi-5-4gb
parts:
  onboard:
  - part: rpi-5-4gb
    qty: 1
  - part: microsd-32gb
    qty: 1
  - part: waveshare-bus-servo-adapter
    qty: 1
  - part: imu-bno085
    qty: 1
  - part: cam-rpi-v3
    qty: 1
    power_w: 1.2
  - part: lipo-3s-1300-tattu
    qty: 1
  - part: buck-pololu-d36v50f5
    qty: 1
  - part: power-switch-xt60
    qty: 1
  - part: fastener-kit-m2-m3
    qty: 1
  - part: bearing-kit-small
    qty: 1
  - part: wiring-kit-bus
    qty: 1
  offboard:
  - part: charger-skyrc-b6neo
    qty: 1
