# Concept candidate D-transmission-example. A candidate is DATA for `python -m openhumanoid.concept evaluate <file>`; it does not pick Adam's design.
# Same height, proportions overrides, joint set, neck pitch + camera and frozen motions as the other examples: only the power
# architecture / actuators differ, so the comparison is about volts and servos, not about different robots.
id: D-transmission-example
description: "Transmission REPRESENTATION example (not an optimised design): candidate A with the ankle-pitch servo moved up into the thigh (rod, ratio 1.0, 90% efficient) and the knee servo moved up into the pelvis (long 4-bar, ratio 1.0, 85% efficient). Lighter shank and thigh, lossier drive."
base: adam
height_m: 0.45
template: humanoid_v2
proportions: {upper_arm: 0.19, forearm: 0.21}     # longer arms than the spec default so a 150 g table pickup is reachable
joints:
  - hip_yaw
  - hip_roll
  - hip_pitch
  - knee
  - {name: ankle_pitch, range: [-80, 60]}      # a 130 deg sit-to-stand with flat feet needs about -75 deg (checked by the evaluator)
  - ankle_roll
  - waist_yaw
  - neck_yaw
  - neck_pitch
  - shoulder_pitch
  - shoulder_roll
  - elbow
  - gripper
# Structure mass recentred by the ODM calibration (challenge-2 row 11): Open Duck Mini's non-servo structure backs out at 0.88 kg
# (11.9 kg/m^3 * 0.42^3) against the engine's 6.4 kg/m^3 (0.47 kg), a 1.86x gap (> 1.5x) -> nominal moved to the ODM point.
mass_model: {structure_kg_at_1m: 11.9}
actuator_default: sts3215-12v
transmissions:
  ankle_pitch: {ratio: 1.0, efficiency: 0.90, host: thigh, note: "servo mounted in the thigh, pushrod to the foot"}
  knee: {ratio: 1.0, efficiency: 0.85, host: pelvis, note: "servo mounted in the pelvis, 4-bar to the knee"}
locomotion:
  walk: {stance_knee_flex_deg: 40}
power:
  pack: lipo-3s-2300-tattu
  charger: charger-skyrc-b6neo
  regulator: buck-5v-5a
  compute: rpi-zero-2w
parts:
  onboard:
    - {part: rpi-zero-2w, qty: 1}
    - {part: microsd-32gb, qty: 1}
    - {part: waveshare-bus-servo-adapter, qty: 1}
    - {part: imu-bno085, qty: 1}
    - {part: cam-rpi-v3, qty: 1, power_w: 1.2}     # R7: head orients towards a person; camera power is an assumption
    - {part: lipo-3s-2300-tattu, qty: 1}
    - {part: buck-5v-5a, qty: 1}
    - {part: power-switch-xt60, qty: 1}
    - {part: fastener-kit-m2-m3, qty: 1}
    - {part: bearing-kit-small, qty: 1}
    - {part: wiring-kit-bus, qty: 1}
  offboard:
    - {part: charger-skyrc-b6neo, qty: 1}
