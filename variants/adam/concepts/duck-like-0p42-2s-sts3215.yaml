# OLD KNOWN-ROBOT CHECK (challenge-1 row 12), NOT Open Duck Mini: spec-default proportions with the packaging floors, 6-DOF legs, 14 STS3215 7.4 V, 2S pack, legs only
# (the template always carries two passive arms; their structure share is dead weight). Challenge #2 found it unfaithful (legs ~20% long, 6 not 5 DOF, wrong mass); the
# faithful comparison is `python -m openhumanoid.concept calibrate-odm` and variants/adam/concepts/odm-like-0p42-5dof.yaml. This file is kept as column (d) of that table.
id: duck-like-0p42-2s-sts3215
description: "Open Duck Mini-like known-robot check, 0.42 m, STS3215 7.4 V, 2S pack, legs only."
base: adam
height_m: 0.42
template: humanoid_v2
joints:
  - hip_yaw
  - hip_roll
  - hip_pitch
  - knee
  - {name: ankle_pitch, range: [-80, 60]}
  - ankle_roll
  - neck_yaw
  - neck_pitch
# Structure mass recentred by the ODM calibration (challenge-2 row 11): Open Duck Mini's non-servo structure backs out at 0.88 kg
# (11.9 kg/m^3 * 0.42^3) against the engine's 6.4 kg/m^3 (0.47 kg), a 1.86x gap (> 1.5x) -> nominal moved to the ODM point.
mass_model: {structure_kg_at_1m: 11.9}
actuator_default: sts3215-7v4
locomotion:
  walk: {stance_knee_flex_deg: 40}
evaluate:
  motions: [stand, walk_forward, walk_backward, turn, squat_90]
power:
  pack: lipo-2s-2200-turnigy
  regulator: buck-5v-5a
  compute: rpi-zero-2w
parts:
  onboard:
    - {part: rpi-zero-2w, qty: 1}
    - {part: microsd-32gb, qty: 1}
    - {part: waveshare-bus-servo-adapter, qty: 1}
    - {part: imu-bno085, qty: 1}
    - {part: lipo-2s-2200-turnigy, qty: 1}
    - {part: buck-5v-5a, qty: 1}
    - {part: power-switch-xt60, qty: 1}
    - {part: wiring-kit-bus, qty: 1}
  offboard:
    - {part: charger-skyrc-b6neo, qty: 1}
