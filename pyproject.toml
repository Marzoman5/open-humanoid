[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openhumanoid"
version = "0.1.0"
description = "Open Humanoid: a toolkit for designing, simulating, sourcing and building humanoid robots of any size or budget."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (software); CERN-OHL-S-2.0 (hardware); CC-BY-SA-4.0 (docs)" }
dependencies = ["pyyaml>=6", "numpy>=1.24", "jsonschema>=4"]

[project.optional-dependencies]
sim = ["mujoco>=3.1"]
cad = ["build123d>=0.7"]
dev = ["pytest>=7"]
design = ["manifold3d>=3.0", "trimesh>=4", "pyvista>=0.43", "scikit-image>=0.22", "matplotlib>=3.7", "pillow>=10", "rtree>=1.0", "shapely>=2.0"]
# P2 concept loop (python -m openhumanoid.concept): casadi for the velocity-limited QP smoother, scipy reserved for solvers
concept = ["casadi>=3.6", "mujoco>=3.1", "scipy>=1.10"]    # scipy: bounded least squares in concept/mintorque.py

[project.scripts]
oh = "openhumanoid.cli:main"

[tool.setuptools.packages.find]
include = ["openhumanoid*"]

[tool.setuptools.package-data]
"openhumanoid.design" = ["*.yaml", "references/*.yaml", "sample/*.yaml"]
"openhumanoid.templates" = ["*.yaml"]
"openhumanoid.actuators" = ["data/*"]
"openhumanoid.concept" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: multi-minute concept-engine runs (deselect with -m 'not slow')"]
