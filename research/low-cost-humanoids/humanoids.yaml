  openness: "Bumi SDK (DDS, github.com/Noetix-Robotics/noetix_sdk_bumi) and Isaac Lab repo (noetix_bumi_lab, BSD-3-Clause code, includes URDF/meshes, licence of CAD not stated separately). Hardware closed. Lower-layer motion control dev: 'none' in spec table."
  confidence: "specs: medium (official site, but site and press disagree on mass/height); price: high for CNY, low for any non-China price; walking: low-medium"
  sources:
