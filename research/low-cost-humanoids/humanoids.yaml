  in_house: null
  compute: "6 TOPS base (Rockchip RK-series per press); EDU +67 / +117 TOPS modules"
  battery: "48 V 5.1 Ah quick-release (~245 Wh, our arithmetic) per official site; press earlier said 48 V >3.5 Ah; 2-3 h claimed"
