zyrestore_intelligent_smart_robot:
  url: https://zyrestore.com/products/intelligent-smart-robot
  verdict: "Not a credible humanoid. USD 44.99 'RC Intelligent Smart Robot' on a generic Shopify dropship storefront (ECOMG LLC, Hartford CT); no height, mass, servo, battery or compute data; 'Sold out' beside an active Add-to-cart; footer order-tracking links to a different domain (obsetic.com). Spec lines (25 joints, 2 cameras, 4 microphones, sonar, touch on head/hands/feet, WiFi+Ethernet) read like the public NAO (SoftBank/Aldebaran) spec, which is a 57 cm, ~5 kg research robot (price not checked); a USD 45 toy cannot have that content, so treat the listing as misleading marketing. The actual product is unidentified."
  evidence: {page_fetch: 2026-10-19, nao_spec_source: "https://en.wikipedia.org/wiki/Nao_(robot)"}
  kind: retail
