    availability_status: "Described 'commercially available' (robozaps). Dec-2025 launch; some retailers sold out / special order."
    openness: "Booster GitHub org public: booster_robotics_sdk (Apache-2.0 LICENSE file in repo), booster_robotics_sdk_ros2, booster_gym, booster_train (Isaac Lab), booster_deploy, booster_assets (BSD-3), robocup_demo (Apache-2.0). GitHub license detection says NOASSERTION for several (gym/train/deploy) - read LICENSE files before relying. Python/C++ SDK; ROS2 interface package. Hardware not open-source. Doubao LLM bundled 6 months."
