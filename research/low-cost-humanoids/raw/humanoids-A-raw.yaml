# Low-cost humanoid survey, half A. Researcher: read-only web (WebSearch/WebFetch + public GitHub API).
# Access date for every URL: 2026-10-19 (some pages report their own earlier check dates).
# Rules: null = unknown. Manufacturer pages primary; retailers/news/aggregators labelled secondary.
# Search results were summarised by a fetcher model; numbers below were taken from fetched pages where noted,
# otherwise from search snippets (marked "search-snippet"). Nothing here is a conclusion.
# NOTE: no robot in this file was verified by the researcher to walk; "walking_evidence" is what exists publicly.

meta:
  topic: cheap (< ~$6k) commercial/open humanoids on sale 2026
  accessed: 2026-10-19
  not_covered_here: [Noetix Bumi, Faraday Future FF Nova, zyrestore, K-Scale (K-Bot/Z-Bot), ToddlerBot, BH Lite]
  headline_observations:
    - Only Unitree R1 / R1 Air and Booster K1 (Geek) are plausibly < $6k list AND from a real manufacturer selling internationally.
    - "R1 $5,900 and R1 Air $4,900 are Unitree's own store list prices EXCLUDING tax and shipping (shipping $300-$1,200, buyer pays customs). AliExpress listing is higher."
    - Unitree R1 Air and standard R1 do NOT support secondary development per Unitree store page; only R1 EDU (price quote, ~$10,500 per one secondary source) does.
    - Booster K1 "from $5,999" (or $4,999 in Oct-2025 marketing) is the Geek edition (48 TOPS, 2 Ah battery ~20-30 min); the research-grade Pro EDU resells at ~GBP 16.6k. I could not load Booster's own price page (JS store).
    - No independent hands-on walking test found for either R1 or K1; B-Human (RoboCup) documents K1 as only partially supported with learned walk tested once.

