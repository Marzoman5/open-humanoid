# Raw actuator research for low-cost humanoid question (maintainer question re Noetix Bumi / low-cost actuator class).
# Access date for everything below: 2026-10-19. Read-only web research (WebSearch/WebFetch). Nothing purchased, no accounts.
# kind: vendor = manufacturer/retailer claim; independent = third-party measurement; derived = computed by the researcher from cited numbers.
# Unknown = null. Torque in N.m, speed in rpm unless stated, mass in g, size in mm, price in USD single-unit unless stated.
# Retailer prices FLUCTUATE (several pages show "From $X", "backordered", sale prices); treat price as a snapshot.
# NO independent (measured) data was found for any commercial actuator below. Every spec is vendor-claimed unless marked otherwise.

meta:
  builder_context: "0.9 m, 20-23 DOF humanoid. hip/knee ~10-60 Nm peak, ankle 10-30, shoulder/elbow 5-20, wrist/neck 1-5"
  accessed: 2026-10-19
  prior_repo_notes: "research/actuators/robstride-02|03|04 and feetech-sts3250 datasheet.yaml (re-verified here; see per-item notes)"
  not_reached_or_not_done:
    - "Damiao official site/store (damiao.com): not fetched; only the official 2025 selection catalog PDF (worldrobotconference.com mirror) was read"
    - "RobStride manuals themselves (PDFs in GitHub repo) not opened; only repo listing + retailer pages"
    - "CubeMars official PDFs for AK45/AK70 not opened; official category page + product pages read"
    - "rcdrone.top collection pages: HTTP 403 (unreachable); individual rcdrone prices only via search snippets"
    - "myactuator.com: 404 on guessed URL; no US USD price found for RMD-X series (only yen/EU listings)"
    - "Unitree official store: no listing found; A1/B1 actuators not researched (null)"
    - "Berkeley Humanoid Lite arXiv PDF >10 MB (WebFetch limit); used arxiv HTML v1 + gitbook docs + public BOM Google Sheet export"
    - "Hiwonder US store pages not opened (prices via RobotShop/OzRobotics/OpenELab snippets)"

# ---------------------------------------------------------------------------------------------------------
# Vendors / where to buy (US hobbyist angle)
# ---------------------------------------------------------------------------------------------------------
retailers:
  aifitlab:
    url: "https://aifitlab.com"
    ship_from: "China (SF Express, 7-12 business days to US; handling 1-5 business days); no US warehouse named"
    duties: "Product-page shipping is an estimate; final checkout 'includes applicable duties/taxes'; customer liable for unpaid customs duties; Alaska/Hawaii excluded"
    source: "https://aifitlab.com/policies/shipping-policy"
    kind: vendor
    note: "Cheapest listed prices for Damiao/RobStride/CyberGear/Unitree; almost every 'Only Motor' variant shows BACKORDERED on 2026-10-19 (collection page says 'In stock' though). Bulk price tier at 5+ units (RS00 $117, RS02 $136, RS05 $103, RS06 $198)."
  openelab_com:
    url: "https://openelab.com (also openelab.io, EUR display)"
    ship_from: "Warehouses named: Somerset NJ (US) / Arlington (US, per .io page) / Munich / Shenzhen. Out-of-stock SKUs 'must be prepared in China': direct from China 10-20 days or replenish US warehouse first 10-20 days. Global Warehouse (YunExpress) 8-15 business days; US warehouse USPS 3-7 business days."
    duties: "openelab.com USD pages state 'Duties & Customs Fees Included' in price (RS02/03/06/10P pages). openelab.io EUR pages say duties are recipient's responsibility for non-EU - conflicting; the .com USD store is the one that claims DDP."
    free_shipping_threshold_usd: 55   # contiguous US; 70 non-contiguous
    kind: vendor
  roboticscenter_ai:
    url: "https://www.roboticscenter.ai/store/brand/robstride/"
    ship_from: "Says it 'stocks select units in San Francisco, California' (per-SKU stock not stated); RS03 page: Backorder, 4-6 weeks, US shipping estimate $66.84 added"
    prices_usd: {RS00: 185, RS01: 185, RS02: 195, RS03: 245, RS04: 295, RS05: 155, RS06: 255}
    kind: vendor
    note: "Highest-priced RobStride reseller seen (US-facing, support claim). Its pages show conflicting weights (e.g. RS03 880 g and 1.5 kg 'net')."
  mjbots:
    url: "https://mjbots.com"
    ship_from: "null (US company; stock counts shown but 'Sold out' labels also shown - unclear)"
    kind: vendor
  cubemars_store:
    url: "https://www.cubemars.com"
    ship_from: "null (no warehouse statement). Free international express shipping over USD 200. No tariff/duty text on product pages."
    note: "Prices on site shown with '$' and no currency code (assumed USD). US retail: RobotShop AK70-10 $563.76 'in stock' (data 2026-10-14) vs CubeMars site $398.9-$498.9."
  robotis_us:
    url: "https://www.robotis.us"
    ship_from: "Corona CA address; ships to the Americas only; XM540 and XH540 both SOLD OUT with 'extended lead time'"

