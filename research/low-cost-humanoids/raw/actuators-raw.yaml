# ---------------------------------------------------------------------------------------------------------
notes_caveats:
  - "All commercial numbers are vendor or retailer claims. No independent bench measurements, dyno data, backlash measurements or failure reports found for RobStride, Damiao, CubeMars, CyberGear or Unitree in this pass. Treat peak torque as transient (RobStride/openelab guides advise designing to rated torque with heat sinking)."
  - "Retailers disagree: aifitlab $145 RS02 (China-ship, backordered) vs openelab.com $174.99 (DDP, China warehouse) vs roboticscenter.ai $195 (+$67 shipping, 4-6 wk). Real delivered US prices are ~20-60% above the headline aifitlab numbers."
  - "Tariffs: no authoritative 2026 tariff rate found. openelab.com says duties are included; aifitlab says duties 'finalized at checkout'. Budget unknown duty risk; check CBP/USITC for HTS rate on Chinese electric motors."
  - "Almost everything is backordered or pre-order with 10-20 working days on a China restock; expect 3-8 weeks for the first order. Damiao/RobStride 'Only Motor' needs a USB-CAN adapter (extra variant)."
  - "Voltage: RobStride RS00-06 are 48 V (15/24-60 V); Damiao J4310/J6006/J8006 default 24 V variants; CyberGear 24 V; Unitree 12-30 V. Mixed packs need separate buses/converters."
  - "Dual encoder (motor+output) on RobStride (except RS01), Damiao, CubeMars V3. CyberGear and RS01 are single. No brakes listed on any of these; holding a pose costs continuous current (thermal limit)."
  - "Higher ratios (CubeMars AK45-36 36:1, Damiao J4340 40:1, J6248P 48:1, RS10P 25:1) trade backdrivability and speed for torque; 6-10:1 QDD (RS03/04/06, J8006, J10010, AK70-10) is the walking-leg class."
  - "Damiao J4310 spec conflict: official 2025 catalog 3/7 Nm 300 g vs aifitlab V4 table 3.5/12.5 Nm 325 g. J6006 catalog 4/11 vs aifitlab 12 Nm peak. Resolve by reading the Damiao manual for the exact drive revision before relying on peak."
  - "RobStride weights/dims conflict between retailers (roboticscenter lists 1.5 kg 'net' for several); aifitlab/pakronics values (e.g. RS03 880 g) agree with each other and with openelab."
  - "Berkeley Humanoid Lite per-joint torque is NOT in the paper text; ~20 Nm (6512) and ~12 Nm (5010) come from a secondary source reading Fig. 3. Gear ratio 15 is inferred from repo config. Derived 27.6 Nm for 6512 is an upper bound at the config's 20 A limit."
  - "BHL total BOM: $4,312 US / $3,236 China; actuators are 81% of cost. BHL's 22 actuators cost less per unit ($136-188) than most commercial ones but are weaker, heavier plastic QDD at ~20 Nm class, and lack dual encoders."
  - "No MuJoCo/Isaac actuator models found for RobStride/Damiao/CubeMars (only generic Isaac Lab actuator configs and generic armature/friction identification papers). Will need own sys-id."
  - "Open-source tooling found: moteus (Apache-2.0 firmware), damiao-motor / DM_Control_Python / LeRobot Damiao bus, community robstride_ros2. RobStride official GitHub has manuals + STEP + OTA, license/SDK not stated."
  - "Noetix Bumi (the maintainer's reference): ~US$1,400 (CNY 9,988), 94 cm, 12 kg; joint motors/BOM not disclosed in any source found. It cannot be explained from this actuator class: 20+ RS00-class actuators alone would be ~$2.5-3k at retail."
  - "Not covered: gimbal motors GM5208/GBM, Unitree A1/B1, MyActuator US price, HighTorque, Hiwonder US store, Dynamixel XL/XM430 (existing repo notes), brakes, tests of printed reducers by third parties."
