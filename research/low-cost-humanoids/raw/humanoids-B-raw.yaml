  - name: Roboto Origin (RPO, formerly ATOM 01)
    maker: Shanghai RoboParty Technology Co., Ltd. (founded 2025-02-21)
    height_m: 1.25         # humanoid.guide + search snippets (secondary); README gives none
    mass_kg: 34            # secondary
    dof: {total: 23, note: "BOM = 14x DM4340P + 9x DM10010L = 23 actuators; leg/arm split not extracted"}
    actuators:
      type: "DAMIAO (Damiao Technology) integrated QDD joint motors, off-the-shelf, CAN"
      bom_v1_0_1_2026-01-05:
        DM_4340P_48V: {qty: 14, unit_cny: 949, note: "DM-J4340P-2EC class: ~9 Nm rated / 27 Nm peak, 40:1, ~375 g (reseller + Damiao selection manual snippets)"}
        DM_10010L: {qty: 9, unit_cny: 1989, note: "DM-J10010L-2EC class: ~40 Nm rated / 120 Nm peak, 10:1, ~1.37 kg (reseller snippets)"}
        actuator_subtotal_cny: 31187   # 13286 + 17901 per BOM rows
      in_house: false
    compute: "D-Robotics RDK X5 8GB (CNY 599 in BOM)"
    battery: "48 V 15 Ah Li-ion pack, CNY 528 in BOM (140x140x115 mm); ~2 h claim secondary"
    walking_evidence: "README: 'running and jumping prototype', demo GIFs in repo; 'can easily achieve walking and running' with released train/deploy code. ~3 m/s claim is secondary. No paper, no independent test found."
    price_usd: null
    price_notes: "Own BOM total CNY 49,743.53 (header says 49,713) = roughly $7,000 at ~7.1 CNY/USD (my conversion; Origin of Bots independently estimates $7,000). Actuators ~63% of BOM. Structural CNC parts alone CNY 15,670. Retail listings conflict: humanoid.guide $4,900 'prototype'; aifitlab $8,950 / $12,450 kit w/o battery. Treat $4,900 as unverified."
    sold_where: "DIY from Taobao + JLC prototyping per README; some resellers list kit (backorder)."
    openness:
      hardware_license_file: "rpo_hardware repo: CERN-OHL-W-2.0 (weak reciprocal) for CAD/PCB/BOM/URDF; software GPL-3.0; docs CC-BY-SA-4.0; V1.0 and V2.0 not compatible"
      aggregator: "roboto_origin repo GPL-3.0 (aggregation layer only); roboparty_train has no license listed on GitHub"
      cad: "STL/assembly + Gerbers in V2.0 dir; BOM_EN.md in roboto_origin/assets"
    sources:
      - {url: "https://github.com/Roboparty/roboto_origin", type: repo}
      - {url: "https://github.com/Roboparty/rpo_hardware", type: repo}
      - {url: "https://github.com/Roboparty/roboto_origin/blob/main/assets/BOM_EN.md", type: bom}
      - {url: "https://humanoid.guide/product/roboto-origin/", type: aggregator-secondary}

