  - name: Berkeley Humanoid Lite
    maker: UC Berkeley Hybrid Robotics Lab (Chi, Liao, Long, Huang, Shao, Nikolic, Li, Sreenath)
    height_m: 0.8          # paper: "stands 0.8 m tall"; press says ~1 m (disagree)
    mass_kg: 16            # paper
    dof: {total: 22, legs: 12, arms: 10, note: "repo configs/policy_humanoid_legs.yaml lists 22 joints: 5-DOF arms, 6-DOF legs; paper BOM = 10x6512 + 12x5010 actuators"}
    actuators:
      type: "3D-printed (PLA) cycloidal gear actuator + BLDC drone motor + B-G431B-ESC1 driver + AS5600 encoder, CAN 1 Mbps; modular, built by the user"
      models: {"6512": "MAD Components M6C12 150KV drone motor", "5010": "5010 BLDC drone motor"}
      per_actuator_cost_usd: {"6512": {us: 188, china: 157}, "5010": {us: 136, china: 94}}
      per_actuator_breakdown_6512_us: {motor: 129, driver: 19, encoder: 3, bearings: 23, fasteners: 5, printed_parts: 4, misc: 5}
      peak_torque_nm: null   # paper text has no torque table (performance-factor chart is an image). Measured: torque tracking error within +-0.5 Nm; stiffness ~319 Nm/rad (6512); example motor_configuration.json has gear_ratio -15 (unclear which actuator)
      in_house: "design is in-house/open; motors are off-the-shelf hobby parts"
    compute: "Intel N95 mini PC (torso), policy 25 Hz MLP onboard; low-level 250 Hz over 4 USB-CAN; BNO085 IMU"
    battery: "6S 4000 mAh LiPo, ~30 min (paper)"
    walking_evidence: "Paper Fig.14: zero-shot sim2real Isaac Gym PPO biped walking, tracks user velocity command, used ~30% of actuator torque limit. NO speeds, terrains, success rates, trial counts reported. Video on project site (biped locomotion)."
    price_usd: 4312
    price_notes: "Paper BOM total US $4,312 / China $3,236. Includes: mini PC $129, 4 USB-CAN $68, 2 hubs $36, IMU $13, battery $70, 10x6512 $1,880, 12x5010 $1,632, 2 grippers $72, extrusion $39, printed parts $200, misc structure $50, misc electronics $123. Abstract: 'under $5,000'. Charger/tools/printer not stated."
    sold_where: "DIY only; print yourself, order parts (Amazon/Taobao sheet), ~a week to assemble per press."
    openness:
      code_license_file: "root LICENCE (sic) = MIT, (c) 2025 Berkeley Humanoid Lite Project Developers"
      other_assets: "README: all other assets CC BY-SA 4.0 (README claim only; no separate license file for CAD found in repo root)"
      cad: "Onshape docs for robot, 6512, 5010, USB-CAN case; MakerWorld .3mf print files; releases page"
    status: "repo pushed 2026-03-10, ~2k stars; no Lite 2 mentioned on site"
    sources:
      - {url: "https://arxiv.org/html/2504.17249v1", type: paper, note: "via summariser; numbers fetcher-reported"}
      - {url: "https://github.com/HybridRobotics/Berkeley-Humanoid-Lite", type: repo}
      - {url: "https://berkeley-humanoid-lite.gitbook.io/docs/releases", type: docs}
      - {url: "https://lite.berkeley-humanoid.org/", type: project-site}

