# Low-cost / open humanoids, half B (K-Scale, Berkeley, Duke, Roboto Origin, Asimov, small open bipeds).
# Read-only web + public GitHub API. Access date for every URL: 2026-10-19.
# null = unknown, never guessed. Numbers from fetched repo files/papers where noted; WebFetch is a summarising
# fetcher so paper numbers are "fetcher-reported" (not independently re-read). Nothing here is a conclusion.
meta:
  accessed: 2026-10-19
  limits: [docs.kscale.dev unreachable (DNS fail x2), docs.zeroth.bot unreachable, Asimov BOM gated behind email form, aiwiki.ai 429, BHL BOM is a Google Sheet (not fetched)]
  fx_note: "CNY->USD conversion for Roboto Origin BOM is the researcher's own ~7.1 CNY/USD assumption, not a sourced rate"

robots:

  - name: K-Bot
    maker: K-Scale Labs (US)
    height_m: 1.4          # secondary (aiwiki.ai via search snippet); outside 0.5-1.3 band
    mass_kg: 34            # secondary; another page says ~30
    dof: {total: 20, legs: 10, arms: 10, note: "secondary, 5 per limb; not verified in repo"}
    actuators: "Robstride motors per secondary sources (K-Scale repo 'kscalelabs/robstride' is a Robstride driver); per-joint models/torque NOT found; 'quasi-direct drive 6:1-10:1' is a secondary claim; 48 V hands/arms bus per kbot mechanical README"
    in_house_actuator: false
    compute: null
    battery: null
    walking_evidence: "kscalelabs/kbot-joystick README embeds real-robot videos; ksim-kbot repo has walking/standing tasks + deploy code. No paper, no speeds/terrains."
    price_usd: 8999
    price_notes: "Founders pre-sale price (Bolte interview coverage); another outlet cited $2,999 pre-sale vs Unitree G1 cut. Only ~2 units shipped (secondary), rest refunded."
    sold_where: "NOT sold: K-Scale ceased operations early Nov 2025 (humanoidsdaily, news). Pre-orders refunded/liquidated."
    openness:
      code_license_file: "kscalelabs/kbot LICENSE = MIT (2025 K-Scale Labs). README text still says GPLv3 -> README and LICENSE file DISAGREE; trust file."
      hardware_license_file: "LICENSE-HW = CERN-OHL-S v2 (strongly reciprocal)"
      cad: "Onshape public link in mechanical/README.md; repo itself holds only READMEs + images (no STEP). Electrical README just points to docs.kscale.dev (unreachable)."
      org: "github.com/kscalelabs repos all MIT (kbot, ksim, kos, firmware, zeroth-bot, actuator ...); last kbot push 2025-11-07"
    company_status: "Wound down Nov 2025 after failed Series A; CEO says should have launched Z-Bot first; IP released open-source (secondary). ~US$400k cash left, raised ~4-4.75M (conflicting, secondary)."
    sources:
      - {url: "https://github.com/kscalelabs/kbot", type: repo}
      - {url: "https://www.humanoidsdaily.com/news/watch-k-scale-labs-ceo-explains-shutdown-i-bet-the-farm-on-the-k-bot-launch", type: news}
      - {url: "https://news.pedaily.cn/202511/557563.shtml", type: news-snippet, note: "search result only"}
      - {url: "https://aiwiki.ai/wiki/k_scale_k_bot", type: secondary-wiki, note: "search snippet only; fetch 429"}

