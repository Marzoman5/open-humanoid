    battery: null
    walking_evidence: "ksim PPO walking example with ZBotConfig exists (secondary); no paper; no verified video seen by researcher"
    price_usd: 999
    price_notes: "Announced retail price (Automate, Interesting Engineering, secondary). README says 'BoM starts at $350'. Never confirmed shipping."
