    mass_kg: null          # 'under 20 lb' per techeblog snippet (secondary)
    dof: {total: null, note: "sources conflict: 12 / 16 / 18"}
    actuators: "Feetech STS3215 serial servos (repo has kos-zbot/firmware/sts3215/ driver + feetech/); Hiwonder LSBC v1.6 servo driver script"
    in_house_actuator: false
