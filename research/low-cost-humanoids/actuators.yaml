caveats:
- "Floor price of any torque-capable integrated joint is about USD 110-145 per joint at retail; 21-23 joints therefore cost USD 2.4-3.3k before anything else is bought."
- "Almost all items backordered or pre-order on 2026-10-19; expect 3-8 weeks for a first order."
- "US duties on Chinese motors are not established by an authoritative source here (sources conflict: 2.5% MFN, +25% Section 301 in some, plus other layers). Treat landed cost as unknown; openelab.com says duties are included."
- "No MuJoCo/Isaac actuator models exist for RobStride, Damiao or CubeMars; Adam would need its own system identification. Noetix's Bumi repo gives a delay-and-PD actuator model for a robot of this class (BSD-3)."
- "No brakes are listed on any of these; holding a pose costs continuous current."
- "RobStride/CubeMars/Damiao control protocols are CAN-based and community drivers exist (damiao-motor, DM_Control_Python, LeRobot Damiao bus, robstride_ros2 unofficial, moteus Apache-2.0). RobStride manuals and STEP files are on GitHub (RobStride/Product_Information); licence/SDK terms not read."
- "Supply-chain concentration: one Chinese vendor family (RobStride) fills nearly every torque class with no second US source."
