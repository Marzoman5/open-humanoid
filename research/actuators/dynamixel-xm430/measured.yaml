  accessed: 2026-10-19
  model: "tau_m = kp(q_cmd-q) - (kd_min+kd)*qdot; linear torque-speed limit to zero at qdot_max; constant braking torque; passive-active ratio 3 (~58% gearbox efficiency); MuJoCo damping/armature/frictionloss"
