  operating_temp_c: {v: [-20, 60], source: "https://servodatabase.com/servo/feetech/sts3215", accessed: 2026-10-19, kind: vendor, note: "Evelta C001: -15..70; Robonine quotes datasheet -10..60"}
  default_max_temp_register_c: {v: 70, source: "https://github.com/commanderfun/STS3215/blob/main/REGISTER_REFERENCE.md", accessed: 2026-10-19, kind: community, note: "wiki aifitlab also 70. Robonine: no active thermal shutdown observed at 71 C"}
  overload_protection: {v: "Registers: Overload_Torque (36) default 80 [%], Protection_Time (35) default 200 [unit unconfirmed], Protection_Torque (34) default 20 [% torque while protected]. Behaviour: torque cut to ~20% (Robonine observed ~20% under prolonged load; rcdrone: unload force 20% of default blocking force held 2 s)", source: "https://github.com/commanderfun/STS3215/blob/main/REGISTER_REFERENCE.md", accessed: 2026-10-19, kind: community, note: "Prior claim 'blocked >80% of locked-rotor torque for 2 s; clears on new position command' only partly supported: 80 % and 200 are register defaults, 2 s = assumed 200 x 10 ms, 'clears on new command' UNSUPPORTED."}
