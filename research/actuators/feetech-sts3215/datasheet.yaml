# Feetech STS3215. VENDOR/RETAILER-CLAIMED unless kind says otherwise. Re-verified 2026-10-19 against each cited page (see research/verification-parts/feetech.md).
# Feetech's own PDF is image-only (cannot be parsed). Feetech product page (C001 only) carries limited specs; most numbers come from Waveshare/Evelta/Seeed/servodatabase.
# Format: {v: value, at: voltage/condition, source, accessed, kind}. null = unknown/unconfirmed.
# KEY RESOLUTION: 19.5 kg.cm is the 7.4 V figure (Feetech + Waveshare label it @7.4V; servodatabase gives 16.5 @6V). Evelta/rcdrone/core-electronics label 19.5 as @6V, which conflicts with Feetech and is treated as a retailer labelling error. 30 kg.cm is the 12 V (C018/C047) figure.
id: feetech-sts3215
variants:
  c001_7v4_1to345:
    gear_ratio: {v: 345, source: "https://www.feetechrc.com/en/2020-05-13_56655.html", accessed: 2026-10-19, kind: vendor, note: "Feetech page: '1:345 copper Gear combination'"}
    nominal_voltage_v: {v: 7.4, source: "https://www.feetechrc.com/en/2020-05-13_56655.html", accessed: 2026-10-19, kind: vendor}
    voltage_range_v: {v: "4-7.4 (Waveshare 7.4V SKU 33014); 6-7.4 (Evelta, core-electronics, rcdrone, switch-science)", source: "https://www.waveshare.com/st3215-servo.htm", accessed: 2026-10-19, kind: vendor, note: "servodatabase '4-14 V' is a generic STS3215 entry (mixes 12V variant) - do not use for C001. Upper limit 7.4 V everywhere => 3S (12.6 V) exceeds the C001 rating; no damage report found either way."}
    stall_torque_kgcm: {v: 19.5, at: "7.4V", source: "https://www.feetechrc.com/en/2020-05-13_56655.html", accessed: 2026-10-19, kind: vendor, note: "Feetech: 'Stall Torque 19.5kg.cm@7.4V'. Waveshare 7.4V SKU: 19.5@7.4V (locked-rotor)."}
    stall_torque_kgcm_at_6v: {v: 16.5, at: "6V", source: "https://servodatabase.com/servo/feetech/sts3215", accessed: 2026-10-19, kind: vendor, note: "also switch-science 16.5@6V. Evelta/core-electronics/rcdrone say 19.5@6V (conflict, probably label error)."}
    rated_torque_kgcm: {v: 6.5, at: "6V (retailer label)", source: "https://evelta.com/st3215-7-4v-19kg-1-345-gear-dual-axis-ttl-string-servo-motor/", accessed: 2026-10-19, kind: vendor, note: "Seeed C001 lists rated 5 kg.cm (7.4V, 1:345). Feetech page gives no rated torque. 5-6.5 is 26-33% of 19.5 stall. Retailer figures, not a measured continuous limit."}
    no_load_speed_rpm: {v: 52, at: "7.4V (0.192 s/60deg per Waveshare; 0.19 per servodatabase)", source: "https://www.waveshare.com/st3215-servo.htm", accessed: 2026-10-19, kind: vendor, note: "Feetech page labels it 'Stall Speed 52RPM@7.4V' (wording quirk)"}
    no_load_speed_rpm_6v: {v: 42, at: "6V (0.238-0.24 s/60deg)", source: "https://evelta.com/st3215-7-4v-19kg-1-345-gear-dual-axis-ttl-string-servo-motor/", accessed: 2026-10-19, kind: vendor}
    stall_current_a: {v: 2.5, at: "7.4V (Waveshare 7.4V SKU)", source: "https://www.waveshare.com/st3215-servo.htm", accessed: 2026-10-19, kind: vendor, note: "6V: 2.0 A (Evelta, core-electronics, switch-science). servodatabase '2-2.7 A' is a range mixing variants."}
    no_load_current_ma: {v: 150, at: "7.4V per Waveshare; also 150 @6V per Evelta (130 @6V per switch-science)", source: "https://www.waveshare.com/st3215-servo.htm", accessed: 2026-10-19, kind: vendor}
    running_current_ma: null   # prior value 650 mA @7.4V (servodatabase) NOT found on that page on re-fetch
    torque_constant_kgcm_per_a: {v: 7.8, at: "7.4V SKU", source: "https://www.waveshare.com/st3215-servo.htm", accessed: 2026-10-19, kind: vendor, note: "Waveshare 'kt 7.8kg.cm/A' (12V SKU: 11)"}
    gear_material: {v: "copper (alloy) per Feetech; metal per Evelta/Seeed", source: "https://www.feetechrc.com/en/2020-05-13_56655.html", accessed: 2026-10-19, kind: vendor}
    motor_type: {v: null, note: "listings conflict (coreless vs core motor) - unconfirmed"}
  c044_7v4_1to191: {gear_ratio: {v: 191, source: "https://github.com/horndeer/SO-ARM101-LeRobot", accessed: 2026-10-19, kind: community, note: "README: C044 1/191, 7.4V, used in leader (2)"}, stall_torque_kgcm: null, no_load_speed_rpm: null, stall_current_a: null, note: "No per-variant torque/speed found. Ratio-scaling (speed ~1.8x, torque ~0.55x) is derived, NOT sourced."}
