  defaults: {max_torque_0p1pct: 1000, overload_torque_pct: 80, protection_time: 200, overcurrent_protection_time: 200, protective_torque_pct: 20, max_temp_c: 70, kp: 32, kd: 32, ki: 0, cw_dead_zone: 1, ccw_dead_zone: 1, max_voltage_0p1v: "140 (commanderfun) - unconfirmed, wiki gives no value", min_voltage_0p1v: "50 (commanderfun) vs 40 (earlier wiki claim, not re-found) - CONFLICT, unconfirmed", protection_current_6p5ma: "511 (aifitlab wiki) vs 0 (commanderfun) - CONFLICT, unconfirmed; LeRobot gripper sets 250"}
  defaults_sources: ["https://github.com/commanderfun/STS3215/blob/main/REGISTER_REFERENCE.md", "https://aifitlab-wiki.super.site/feetech-servo-motor-docs/feetech-sts-servo-memory-table-analysis", "https://github.com/tomwhipple/biped-robot/issues/73"]
