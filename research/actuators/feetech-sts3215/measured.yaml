  source: "https://mcobzarenco-fontaine-blog.static.hf.space/posts/2026-08-11-sim-servo-sysid.html"
  accessed: 2026-10-19
  voltage: null   # not stated
  fitted: {kp: 108.18, kv: 13.377, forcerange_nm: 3.478, damping: 0.722, frictionloss: 0.0183, armature: 0.2045}
  baselines: {menagerie: {kp: 998.22, kv: 2.731, forcerange: 2.94, val_mae_deg: 3.31}, upstream_TheRobotStudio: {kp: 17.8, kv: 0, forcerange: 3.35, val_mae_deg: 2.8}, fitted_val_mae_deg: 1.76}
