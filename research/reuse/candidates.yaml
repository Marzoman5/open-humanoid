      root LICENSE; no per-folder LICENSE found in tree listing (listing was truncated at 100k chars; print/mods/
      not fully seen). README has no license text, so there is no README/LICENSE conflict. Apache-2.0 is applied
      to CAD/STL/docs too although it is a software license; applicability to hardware is legally untested. Community
      mods under print/mods/ (Justins_Park_Head_Mod, v2_Jaimes_Mods) may carry other authors; their own README not
      checked (null).

      '
  - kind: CAD source
    path: Onshape doc 64074dfcfa379b37d8a47762 (linked from README)
    license_spdx: null
    license_url: null
    license_note: Onshape doc license not stated in README; treat as covered by repo Apache-2.0 only by assumption.
