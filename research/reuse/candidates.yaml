    license_spdx: Apache-2.0
    license_url: 'https://raw.githubusercontent.com/apirrone/Open_Duck_Mini/v2/LICENSE   # accessed: 2026-10-19'
    license_note: Covered by root LICENSE (inferred from repo-wide license; no separate file).
  - kind: sim assets
    path: mini_bdx/robots/open_duck_mini_v2/{robot.urdf,robot.xml,robot_motors.xml,scene*.xml} + STL meshes
    license_spdx: Apache-2.0
    license_url: 'https://raw.githubusercontent.com/apirrone/Open_Duck_Mini/v2/LICENSE   # accessed: 2026-10-19'
    license_note: Root license; per-file headers not checked (null).
  - kind: trained policy
    path: BEST_WALK_ONNX.onnx, BEST_WALK_ONNX_2.onnx
    license_spdx: Apache-2.0
    license_url: 'https://raw.githubusercontent.com/apirrone/Open_Duck_Mini/v2/LICENSE   # accessed: 2026-10-19'
    license_note: Root license only. Policies are for the Duck's own kinematics/dynamics, not transferable to Adam.
  - kind: docs
    path: docs/ (assembly_guide.md, print_guide.md, sim2real.md, configure_motors.md, feetech_identification.md,
      wiring diagrams)
    license_spdx: Apache-2.0
    license_url: 'https://raw.githubusercontent.com/apirrone/Open_Duck_Mini/v2/LICENSE   # accessed: 2026-10-19'
    license_note: Root license; no separate doc license.
  reusable_for_adam: 'Best-in-class reference for a STS3215 biped: wiring + motor config (docs/configure_motors.md,
    wiring drawio), Feetech identification math (docs/feetech_identification.md), sim2real guide (docs/sim2real.md),
    placo walk engine (mini_bdx/mini_bdx/placo_walk_engine), experiments/identification, MJCF/URDF structure and
    head/neck mechanics (head pitch/yaw/roll STLs, print/mods Park head). Kinematics are for a 42 cm duck with no
    arms, so leg/body CAD must be redesigned for a 0.5 m humanoid with arms and grippers.

    '
  effort: M
  maturity: '4319 stars, 549 forks (GitHub API); last push 2026-01-31; created 2024-05-16; README claims BOM under
    $400, walks on real hardware (BAM-identified actuators, RL sim2real). Build count not stated (null); forks suggest
    hundreds of interested builders.

    '
  sts3215_compat: 'Servo model and voltage NOT stated in README/print_guide/feetech_identification (null from fetched
    docs); the project pairs with BAM actuator identification (bam supports feetech_sts3215_7_4V). So 7.4 V STS3215
    is the likely config, but unconfirmed from these files; verify against BOM sheet (not fetched).

    '
  license_compat_with_ours: 'Apache-2.0 is permissive: software compatible with MIT (keep NOTICE/attribution, state
    changes). Apache-2.0 on CAD/docs is compatible for incorporation into CERN-OHL-S / CC-BY-SA works (permissive
    input, retain notices). Combining is one-way (Apache into our copyleft is fine; our copyleft not back into theirs).
