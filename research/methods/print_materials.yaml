# Open Humanoid - FDM material properties (machine-readable). Access date for all URLs: 2026-10-19.
# Rules: null = not found in a primary/manufacturer source (never guessed).
# CAVEAT (all vendors): datasheets say values are "for reference and comparison only, not for design".
# Specimens are 100% infill, 2 walls; real parts at 15-40% infill are weaker. Use for relative ranking and FEA seeds.
# Polymaker specimens: ISO 527 (tensile), ISO 178 (bend), ISO 179 (notched Charpy). "Z" = layers perpendicular to load.
# z_over_xy_* fields are DERIVED here (Z / XY from the same datasheet), not published by vendors.
units: {density: g/cm3, strength: MPa, modulus: MPa, elongation: percent, charpy: kJ/m2}
materials:
  PLA:
    product: Polymaker PolyMax PLA (tough PLA)
    density: 1.2            # range 1.17-1.24, ISO 1183
    tensile_xy: 41.3
    tensile_z: 32.4
    modulus_xy: 2150.8
    modulus_z: 1983.6
    elongation_break_xy: 5.7
    elongation_break_z: 4.7
    z_over_xy_strength: 0.78
    z_over_xy_elongation: 0.82
    impact: {notched_charpy_xy: 38.9, notched_charpy_z: null, note: "PolyMax is impact-modified; standard PLA (PolyLite) is 3.3 kJ/m2 XY notched - brittle"}
    other_vendor_points:
      - {product: Bambu PLA Basic, density: 1.24, tensile: "35 +/- 4", elongation_break: "12.2 +/- 1.8", xy_z_split: null, std: ISO 527/1183, url: "https://filament2print.com/en/bio-sustainable/3506-pla-basic-bambu-lab.html"}
      - {product: Polymaker PolyLite PLA, density: 1.17, tensile_xy: 52.3, notched_charpy_xy: 3.3, url: "https://wiki.polymaker.com/polymaker-products/polymaker-filaments/technical-data-at-a-glance"}
    print_settings: {nozzle_c: 230, bed_c: 50, walls: 2, top_bottom_layers: 3, infill_pct: 100, fan: on}
    std: ISO 527 / ISO 178 / ISO 179
    tg_or_hdt_c: null
    sources: ["https://wiki.polymaker.com/polymaker-products/more-about-our-products/documents/technical-data-sheets/pla/polymax-tm-pla"]
  PLA_plus:
    product: Polymaker PolyLite PLA Pro (nearest "PLA+" with XY/Z data)
    density: 1.22
    tensile_xy: 49.8
    tensile_z: 36.5
    modulus_xy: 2932.2
    modulus_z: 2633.0
    elongation_break_xy: 6.3
    elongation_break_z: 2.4
    z_over_xy_strength: 0.73
    z_over_xy_elongation: 0.38
    impact: {charpy_xy: 17.1, charpy_z: null, note: "vendor does not state notched/unnotched on the wiki page"}
    print_settings: {nozzle_c: 210, bed_c: 25, walls: 2, top_bottom_layers: 4, infill_pct: 100, fan: on}
    std: ISO 527 / ISO 178 / ISO 179
    note: "'PLA+' is not a standard; every brand differs. Brittle in Z (2.4% elongation)."
    sources: ["https://wiki.polymaker.com/polymaker-products/more-about-our-products/documents/technical-data-sheets/pla/polylite-tm-pla-pro"]
  PETG:
    product: Polymaker PolyMax PETG
    density: 1.24
    tensile_xy: 37.9
    tensile_z: 29.4
    modulus_xy: 1684
    modulus_z: 1603
    elongation_break_xy: 5.22
    elongation_break_z: 3.10
    z_over_xy_strength: 0.78
    z_over_xy_elongation: 0.59
    impact: {notched_charpy_xy: 11.6, notched_charpy_z: 2.4, note: "Z impact is ~80% lower than XY - layer-line delamination dominates drops"}
    other_vendor_points:
      - {product: Prusament PETG, density: 1.27, tensile_filament: 46, tensile_printed_horizontal: 47, tensile_printed_vertical: 50, notched_charpy_horizontal: 6, notched_charpy_vertical: 3, std: "ISO 527 / ISO 1183 / ISO 179", url: "https://www.3dprintergear.com.au/assets/files/technical-data-sheet%20(1).pdf", note: "Prusa 'vertical' value is higher than XY, unlike Polymaker; vendors disagree, test your own coupons"}
    print_settings: {nozzle_c: 240, bed_c: 80, walls: 2, top_bottom_layers: 3, infill_pct: 100, fan: off}
    std: ISO 527 / ISO 178 / ISO 179
    tg_or_hdt_c: 68   # Prusament PETG HDT at 0.45 and 1.8 MPa
    sources: ["https://wiki.polymaker.com/polymaker-products/more-about-our-products/documents/technical-data-sheets/petg-pet/polymax-tm-petg", "https://www.3dprintergear.com.au/assets/files/technical-data-sheet%20(1).pdf"]
  ABS_ASA:
    ABS:
      product: "Polymaker PolyLite ABS (V5.6; density differs between revisions: 1.12 older, 1.04 newer)"
      density: 1.04
      tensile_xy: 33.4
      tensile_z: 29.7
      modulus_xy: 2246.6
      modulus_z: 2080.9
      elongation_break_xy: 17.9
      elongation_break_z: 3.1
      z_over_xy_strength: 0.89
      z_over_xy_elongation: 0.17
      impact: {notched_charpy_xy: 18, notched_charpy_z: null}
      tg_or_hdt_c: {tg: 101, vicat: 104}
      sources: ["https://wiki.polymaker.com/polymaker-products/more-about-our-products/documents/technical-data-sheets/abs-asa/polylite-tm-abs", "https://wiki.polymaker.com/polymaker-products/polymaker-filaments/technical-data-at-a-glance"]
      note: "Source wiki page has a row-label error and PDF a typo; values cross-checked via search summary only - medium confidence"
    ASA:
      product: Polymaker PolyLite ASA
      density: 1.13
      tensile_xy: 43.8
      tensile_z: 32.0
      modulus_xy: 2379
      modulus_z: 1965
      elongation_break_xy: 6.7
      elongation_break_z: 1.65
      z_over_xy_strength: 0.73
      z_over_xy_elongation: 0.25
      impact: {notched_charpy_xy: 10.3, notched_charpy_z: 6.7}
      print_settings: {nozzle_c: 260, bed_c: 90, chamber_c: 90, walls: 2, top_bottom_layers: 3, infill_pct: 100, fan: off}
      std: ISO 527 / ISO 179
      sources: ["https://wiki.polymaker.com/polymaker-wiki-pt/produtos-polymaker/mais-sobre-nossos-produtos/documentos/fichas-tecnicas/abs-asa/polymaker-tm-asa"]
    note: "Needs enclosure and ~90 C chamber for spec values; poor fit for open-frame printers."
  CF_nylon:
    product: Polymaker Fiberon PA12-CF10 (annealed specimens)
    density: 1.06
    tensile_xy: 71.6          # product page; the vendor wiki table lists 77.4 - vendor internal mismatch (different revision)
    tensile_z: 43.3
    modulus_xy: 3304
    modulus_z: 1801
    elongation_break_xy: 3.5
    elongation_break_z: 3.3
    z_over_xy_strength: 0.60
    z_over_xy_elongation: 0.94
    impact: {notched_charpy_xy: 9.9, notched_charpy_z: null}
    annealing: "80 C 6 h (product page) vs 100 C 16 h (shop listing / CN TDS) - vendor conflict"
    drying: "100 C 8-10 h if wet; dry-state values only. Nylon absorbs water -> lower stiffness (wet values not captured)."
    std: ISO 527
    print_settings: null
    note: "Requires hardened nozzle; PA12-CF is the stiffest option but strongly anisotropic (Z only 60% of XY)."
    sources: ["https://polymaker.com/product/polymide-pa12-cf/", "https://wiki.polymaker.com/polymaker-products/polymaker-filaments/technical-data-at-a-glance"]
    PA_CF_other: null   # Bambu PAHT-CF / PA6-CF TDS not retrievable (bambulab.com returned 403)
  TPU:
    product: Polymaker PolyFlex TPU95 (Shore 95A)
    density: 1.22          # range 1.20-1.24
    tensile_xy: null       # current V5.4 TDS reports stress at strain, not break strength
    stress_at_100pct_strain_xy: 11.1
    stress_at_200pct_strain_xy: 15.0
    stress_at_300pct_strain_xy: 21.0
    stress_at_400pct_strain_xy: 25.8
    tensile_z: null
    modulus_xy: 33.6       # tensile modulus per ISO 37 (very low vs rigid plastics)
    modulus_z: null
    elongation_break_xy: 551.2
    elongation_break_z: null
    z_over_xy_strength: null
    hardness: "95A (ISO 7619-1)"
    legacy_v4_sheet: {tensile: 29.0, elongation_break: 330.1, std: "ASTM D638", url: "https://cdn.shopify.com/s/files/1/1339/4265/files/Polymaker_PolyFlex_TPU95_TDS_V4.pdf", note: "older revision, differs from V5.4"}
    impact: {note: "does not fracture in Charpy-type tests in practice; not reported by vendor", value: null}
    print_settings: {nozzle_c: 230, bed_c: 50, walls: 2, top_bottom_layers: 3, infill_pct: 100, fan: on}
    std: ISO 37 (V5.4)
    sources: ["https://wiki.polymaker.com/polymaker-products/more-about-our-products/documents/technical-data-sheets/tpu/polyflex-tm-tpu95"]
anisotropy_literature:
  - {claim: "ASTM D638 Type I: X-build tensile higher than Z-build by ~25% (PLA), ~42% (ABS), ~128% (PETG); Z specimens brittle", url: "https://scholars.csus.edu/esploro/outputs/graduate/Mechanical-and-FEA-comparison-of-FDM/99258311232901671", confidence: "from search summary, not read in full"}
  - {claim: "Robot-builder guide: Z tensile ~30-50% below XY for PLA", url: "https://zbotic.in/3d-printed-robot-parts-structural-design-considerations-for-strength-and-durability/", confidence: "secondary source"}
fatigue_reference:
  - {material: PLA, rule: "S-N slope k=5.5 (inverse), endurance limit at 2e6 cycles ~10% of UTS, Pf>95%", url: "https://eprints.whiterose.ac.uk/id/eprint/133457/"}
  - {material: ASA, fatigue_limit_fraction_of_UTS: 0.25, R: 0.05, url: "https://eprints.whiterose.ac.uk/id/eprint/150845/", note: "via search summary; ASA/PC/PA12/PC-ABS study"}
  - {material: PA12, fatigue_limit_fraction_of_UTS: 0.17, R: 0.05, url: "https://eprints.whiterose.ac.uk/id/eprint/150845/"}
  - {material: PETG, fatigue_limit_fraction_of_UTS: null, url: "https://api.crossref.org/works/10.3390/polym18020302", note: "S-N curves exist (Martins 2024, R=0.2, 45 deg raster) but fractions not extracted"}
