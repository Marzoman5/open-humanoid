# Domain randomization ranges per project. Access date for all sources: 2026-10-19.
# Ranges are [lo, hi]. op: scale = multiply nominal, add = add offset, set = replace value.
# null = not randomised / not stated in the source. Units in "units". See b-domain-randomization.md.
schema_version: 1
accessed: "2026-10-19"
verification: "Re-verified 2026-10-19 against main/master HEAD (no SHAs). source_lines are approximate (+-2); Playground/ToddlerBot/ksim lines are block-level from fetch summaries. See research/verification-parts/methods-abc.md."
projects:
  open_duck_mini:
    source: https://github.com/apirrone/Open_Duck_Playground/blob/main/playground/common/randomize.py
    env_source: https://github.com/apirrone/Open_Duck_Playground/blob/main/playground/open_duck_mini_v2/joystick.py
    servo: Feetech STS3215
    ctrl_dt_s: 0.02
    sim_dt_s: 0.002
    floor_friction: {op: set, range: [0.5, 1.0], source_lines: "randomize.py#L43-L45"}
    joint_frictionloss: {op: scale, range: [0.9, 1.1], source_lines: "randomize.py#L47-L52"}
    armature: {op: scale, range: [1.0, 1.05], source_lines: "randomize.py#L54-L59"}
    joint_damping: null
    link_mass: {op: scale, range: [0.9, 1.1], source_lines: "randomize.py#L68-L71"}
    torso_mass: {op: add, range: [-0.1, 0.1], units: kg, source_lines: "randomize.py#L73-L76"}
    torso_com: {op: add, range: [-0.05, 0.05], units: m, per_axis: true, source_lines: "randomize.py#L61-L66"}
    default_joint_pos: {op: add, range: [-0.03, 0.03], units: rad, source_lines: "randomize.py#L78-L86"}
    kp: {op: scale, range: [0.9, 1.1], source_lines: "randomize.py#L88-L95"}
    kd: null
    motor_strength: null
    backlash: {fixed: 0.5, units: deg, note: "separate backlash joint, not randomised", source: "https://github.com/apirrone/Open_Duck_Playground/blob/main/playground/open_duck_mini_v2/xmls/joints_properties.xml#L7-L11"}
    action_delay: {config_range_steps: [0, 3], effective_range_steps: [0, 2], note: "jax.random.randint maxval exclusive", units: ctrl_steps, equivalent_ms_max: 40, source_lines: "joystick.py#L62-L63"}
    imu_delay: {config_range_steps: [0, 3], effective_range_steps: [0, 2], units: ctrl_steps, source_lines: "joystick.py#L64-L65"}
    push: {range: [0.1, 1.0], units: "m/s added to base xy velocity", interval_s: [5.0, 10.0], source_lines: "joystick.py#L89-L92"}
    obs_noise_uniform_halfwidth:
      hip_pos_rad: 0.03
      knee_pos_rad: 0.05
      ankle_pos_rad: 0.08
      joint_vel_rad_s: 2.5
      gravity: 0.1
      linvel: 0.1  # config value; noise commented out in _get_obs (not applied)
      gyro_rad_s: 0.1
      accelerometer: 0.05
      source_lines: "joystick.py#L66-L75"
  toddlerbot:
    source: https://github.com/hshi74/toddlerbot/blob/main/toddlerbot/locomotion/mjx_config.py
    note: dataclass defaults only; walk.gin checked (add_head_pose=True, add_push off, no range overrides); other 14 gin task configs not checked
