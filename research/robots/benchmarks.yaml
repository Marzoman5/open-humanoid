- id: berkeley_humanoid_lite
  name: Berkeley Humanoid Lite
  height_m: {value: 0.8, basis: vendor, note: "one Berkeley news piece says ~1 m; paper and R&D World say 0.8"}
  mass_kg: {value: 16, basis: vendor}
  dof: {leg: null, arm: 5, total: 22, note: "22 actuators (10x 6512, 12x 5010) + 2 grippers; leg DOF not stated"}
  actuators: "3D-printed cycloidal: 10x 6512 (M6C12 150KV BLDC) + 12x 5010, B-G431B-ESC1 drivers, AS5600 encoders"
  torque_nm_peak: null
  compute: "Intel N95 mini PC; 4x CAN 1 Mbps"
  battery: {voltage_v: 22.2, wh: 88.8, note: "6S 4000 mAh LiPo; V and Wh derived at 3.7 V/cell; ~30 min"}
  cost_usd: {value: 4312, year: 2025, basis: vendor, note: "paper abstract says under $5,000; BOM total 4312 US sourcing; $3,236 China; actuators $188 (6512) / $136 (5010)"}
  walking_speed_mps: null
  sim_to_real_zero_shot: yes   # PPO in Isaac Gym transferred directly, 25 Hz
  sim: "Isaac Gym"
  lessons:
    - "Policy used only ~30% of actuator torque limit."
    - "60-hour durability test: backlash grew with wear, max 0.0229 rad, still acceptable; efficiency drops at high torque/speed due to heat."
    - "PLA cycloidal reducer stiffness ~319 Nm/rad vs ~1468 for CF-reinforced printed reducer; thermal effect on printed structure not studied."
  sources:
    - {url: "https://arxiv.org/html/2504.17249", accessed: 2026-10-19}
    - {url: "https://www.rdworldonline.com/berkeley-debuts-5000-open-source-humanoid-built-with-desktop-3d-printers/", accessed: 2026-10-19}
    - {url: "https://engineering.berkeley.edu/news/2025/11/building-bots-on-a-budget/", accessed: 2026-10-19}
