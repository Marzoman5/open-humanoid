# Benchmarks of comparable small/mid humanoids. Unknown = null (never guessed).
# basis: vendor = vendor/spec-sheet claim; measured = paper-reported measurement; derived = our arithmetic.
# Every entry lists sources (url + accessed). Fields without support in the listed sources are null.
schema_version: 1
robots:
- id: toddlerbot
  name: ToddlerBot (Stanford)
  height_m: {value: 0.56, basis: vendor}
  mass_kg: {value: 3.4, basis: measured, note: "3484 g"}
  dof: {leg: 6, arm: 7, total: 30, other: "neck 2, waist 2"}
  actuators: "Dynamixel XC330-T288, XC430-T240BB, XM430-W210, 2XL430-W250, 2XC430-W250; 30 motors total, per-model count not given"
  torque_nm_stall: {hip_pitch_roll: 1.8, hip_yaw: 1.0, knee: 3.0, basis: vendor, note: "estimated required: knee 2.35, hip pitch 1.77, ankle pitch 2.66"}
  compute: "NVIDIA Jetson Orin NX 16GB"
  battery: {voltage_v: 14.8, wh: null, note: "2000 mAh or 5000 mAh 4-cell options; Wh not stated; paper estimates ~75 Wh for 1 h walking"}
  cost_usd: {value: 6000, year: 2025, basis: vendor, note: "upper bound ('under 6,000'); ~90% motors+computer"}
  walking_speed_mps: null
  sim_to_real_zero_shot: yes   # walking RL policy; chirp-based motor sysid
  sim: "MuJoCo / MJX, Brax"
  lessons:
    - "Motor temperature rise pushed robot out of policy training distribution -> more falls; actuation model ignores temperature."
    - "Survives up to 7 falls before breaking; longest 19 min without falling; 3D-printed parts break more than metal on impact."
    - "Needed chirp-based motor system-ID (avg tracking error 1.3 deg); XC330 units have higher backlash/tracking error."
    - "Agile tasks limited by motor speed/torque/comm speed."
  sources:
    - {url: "https://arxiv.org/html/2502.00893v4", accessed: 2026-10-19}
- id: open_duck_mini_v2
  name: Open Duck Mini v2 (apirrone)
  height_m: {value: 0.42, basis: vendor}
  mass_kg: null
  dof: {leg: null, arm: 0, total: 14, note: "14 servos per reseller; example MJCF has 13 position actuators (hips, knees, ankles + 3 head)"}
  actuators: "Feetech STS3215 (7.4 V) x14 (reseller listing; v2 BOM); v1 alpha used Dynamixel XC330-M288-T legs"
  torque_nm_stall: {note: "STS3215: 19.5 kg.cm @6V = 1.91 Nm (copper gear); 30 kg.cm @12V = 2.94 Nm (steel gear); vendor"}
  compute: "Raspberry Pi Zero 2W (Pi 5 variant offered)"
  battery: {voltage_v: 7.4, wh: 22.2, note: "2S Li-ion 3000 mAh 18650 pack per reseller; Wh derived 7.4 x 3.0"}
  cost_usd: {value: 400, year: 2025, basis: vendor, note: "BOM target 'under $400', not measured"}
  walking_speed_mps: null
  sim_to_real_zero_shot: partial   # README: "Sim2Real walking is starting to work"
  sim: "Isaac Gym -> MuJoCo (sim2sim); moving to MuJoCo Playground"
  lessons:
    - "v1 alpha: 'too much play at some joints', hard to build; author upgraded XL330 -> XC330 because XL330 underpowered."
    - "Rhoban BAM ships a Feetech STS3215 7.4V model (m1/m4/m6); that Open Duck Mini used it is UNVERIFIED."
    - "STS3215 datasheet: overcurrent protection trips at >2 A for ~2 s; stall protection >80% locked-rotor for 2 s; reseller advises <=50% of max ratings for longevity."
    - "No public measured mass, speed, or overheating report found."
  sources:
    - {url: "https://raw.githubusercontent.com/apirrone/Open_Duck_Mini/v2/README.md", accessed: 2026-10-19}
    - {url: "https://gitee.com/MatLzg/Open_Duck_Mini", accessed: 2026-10-19}
    - {url: "https://aifitlab-wiki.super.site/openduckmini-docs", accessed: 2026-10-19}
    - {url: "https://aifitlab.com/products/openduckmini-open-source-version-of-the-bdx-droid", accessed: 2026-10-19}
    - {url: "https://bam.readthedocs.io/en/latest/usage/actuators.html", accessed: 2026-10-19}
    - {url: "https://aifitlab.com/products/feetech-sts3215-servo-motor", accessed: 2026-10-19}
    - {url: "https://raw.githubusercontent.com/apirrone/Open_Duck_Mini/v2/docs/prepare_robot.md", accessed: 2026-10-19}
