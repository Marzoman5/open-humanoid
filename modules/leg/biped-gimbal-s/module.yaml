# Generated geometry: openhumanoid/cad/biped.py Builder.leg (template biped_v1)
id: biped-gimbal-s
kind: leg
name: 6-DOF leg, gimbal hip (yaw > roll > pitch) and gimbal ankle (pitch > roll), size class S
version: 0.1.0
status: concept
authors: [claude-p3]
license: CERN-OHL-S-2.0
valid:
  height_m: [0.40, 0.65]
  actuator_family: [feetech_sts]
  interface_class: S
provides:
  joints:
    - { name: hip_yaw, axis: z }
    - { name: hip_roll, axis: x }
    - { name: hip_pitch, axis: y }
    - { name: knee, axis: y }
    - { name: ankle_pitch, axis: y }
    - { name: ankle_roll, axis: x }
requires:
  actuators: { all: sts3215-12v }
  hal: feetech_sts
interfaces:
  proximal: { class: S, type: mount }        # hip-yaw horn under the pelvis cradle
  distal: { class: S, type: sole }
notes: >
  Roll servo sits behind the hip centre (glute) and in the forefoot (toe cap). Hip and ankle yoke axes
  intersect, matching the sim's compound joints. The foot grows past the spec footprint to house the
  ankle-roll servo (reported by `oh cad build`).
cad:
  backend: build123d
  export: built per variant by `oh cad build <id>`
